<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Client Practice</title>
<style>
  :root{
    --ink:#1b1b1f; --ink2:#46464f; --ink3:#6b6b75;
    --indigo:#5055ad; --indigo-d:#383c94; --lav:#f1efff; --lav2:#e1e0ff; --surface:#fcf8fd; --line:#c9c6d6;
    --err:#ba1a1a; --teal:#066888; --teal-l:#e6f1f4; --teal-d:#044a61; --ok:#1f7a4d; --ok-l:#e7f5ec; --warn:#8a5a00; --warn-l:#fff4dd;
    --font:"Open Sans","Noto Sans",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:14px/1.5 var(--font)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  [hidden]{display:none !important}
  :focus-visible{outline:3px solid #0b6fd4;outline-offset:2px;border-radius:4px}
  /* No narrow-viewport branch. The simulation is launched full screen on a desktop;
     the work it depicts happens on a phone, which is a fact about the JOB and not
     about taking the training. Lesson 1 had one and it was removed on purpose. */

/*__PANEL_CSS__*/
/*__RIG_CSS__*/

/*__FORM_CSS__*/
</style>
</head>
<body>
<!--__PANEL_HTML__-->

  <!-- ================= CLARITY ================= -->
<section class="app clarity" aria-label="Practice Clarity">
  <!--__FORM__-->
</section>

<!--__RIG_HTML__-->

<script>
"use strict";
/* What the shared rig and panel need from a host page. Small on purpose: a
   selector helper, an escaper, and a tick the beat runner reads. */
function $(sel){ return document.querySelector(sel); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var S={tick:0};
/* Where she is allowed to stand in THIS interface, and what she must not cover.
   Lesson 1's map named a results table and rows; this one is a form, so the
   anchors are the sections of it a piece of feedback is actually about. */
var LZ_HOST={
  anchors:{
    form:"#form", card:"#form .card", identity:"#ssn", name:"#first",
    dob:"#dob", quality:"#qname", refused:"#cr", demographics:"#gender",
    consent:"#perm", documentation:"#doc", save:".footer",
    topbar:".topbar", header:".panel-hd"
  },
  fallback:["card","form"],
  /* The Save button is the only way to answer, and the form is what she is
     talking about — covering either turns a guide into an obstacle. */
  keepClear:function(){ return [{sel:".footer", w:12}]; }
};
/*__RIG_JS__*/
/*__FORM_JS__*/
(() => {
  /* The form's own behaviour lives in add-client-form.js, shared with the
     walkthrough. What is left in here is this sim's: nine situations and how they
     are judged. `$` takes an id, as the prototype's did. */
  const $ = FORM.byId, val = FORM.val, resetForm = FORM.reset, signed = FORM.signed;
  // ---------- tasks (copy from the Lesson 3 script) ----------
  const T = [
    { scen:'A man at a drop-in center gives you his full name and spells it for you. Anthony Reyes-Marchetti. He gives his date of birth as 03/09/1979 and reads his Social Security Number off a card in his wallet. He signs the consent on your tablet.',
      instr:'Create his profile.', hint:'Everything he gave you is complete. Set each code to say so, and record how he consented.',
      eval(){ const ok = val('qssn')==='Full SSN Reported' && val('qname')==='Full name reported' && val('qdob')==='Full DOB Reported' && val('doc')==='Electronic Signature';
        return ok ? {ok:true, fb:'Three full answers, three full codes, electronic signature. This is the easy version, and it is rarer than you would like. Notice you still had to set all three codes by hand. The form does not infer them from what you typed, and it will happily save a full name marked as partial.'}
                  : {ok:false, fb:'He gave you everything in full and signed on the tablet. Every code should say full, and Documentation should say Electronic Signature. The form does not set the codes for you, no matter how complete the answers were.'}; } },

    { scen:'A woman gives her name as Dee. That is all she says. You start the record.', instr:'Set Quality of Name for what you have right now, then continue the conversation.',
      hint:'Set the code for what you have when you have it. Then change it when she gives you more.',
      stage2:'A minute later she adds that her last name is Okonkwo, and spells it for you. O-K-O-N-K-W-O. Update the record and save.',
      onCont(){ this.snap = val('qname'); },
      eval(){ const a=this.snap, b=val('qname');
        if (a==='Full name reported') return {ok:false, tag:'Incorrect — left as Full name reported', fb:'When she had given you Dee and nothing else, that was a partial name. The code describes the answer you actually had. If she had walked away at that point, this record would claim to hold a full name that nobody ever gave you.'};
        if (a==='Partial, street name, or code name reported' && b==='Full name reported') return {ok:true, fb:'Partial until it is not. Codes are not set once at the end. They track the conversation, and the conversation moves.'};
        return {ok:false, fb:'Two moments, two codes. With only Dee, the honest code is Partial, street name, or code name reported. Once she gave you Okonkwo, it becomes Full name reported. The record should have moved with the conversation.'}; } },

    { scen:'A man tells you he was born in 1974. He does not know the day or the month. He is clear that he is not guessing and would rather not make something up.',
      instr:'Record his date of birth and set Quality of DOB.', hint:'A year alone is a partial date of birth, not a missing one. There is a convention for what goes in the month and day.',
      eval(){ const q=val('qdob'), d=val('dob');
        if (q==="Client doesn't know") return {ok:false, tag:'Incorrect — chose Client doesn’t know', fb:'He does know part of it. He gave you the year, and he was careful to be honest about the rest. "Client doesn’t know" throws away the year you have. Partial keeps it, and a year is searchable.'};
        if (q==='Approximate or partial DOB reported' && /1974/.test(d)) return {ok:true, fb:'01/01/1974, and Approximate or partial DOB reported. January 1 is the placeholder everyone in the system recognizes as a placeholder, and the year is real. Last lesson you found Katherine Morrison from a year and nothing else. This is that record, from the other side. If he had not known the year either, you would have asked his age and worked the year out from that. Same entry, same code.'};
        return {ok:false, fb:'The year is real, so it belongs in the record: 01/01/1974, with Quality of DOB set to Approximate or partial DOB reported. January 1 is the convention for the part he does not know.'}; } },

    { scen:'A woman gives you her name and date of birth without hesitating. When you ask about a Social Security Number she says, "I’d rather not. Not today."',
      instr:'Complete her profile and set Quality of SSN.', hint:'She answered you. Record the answer she gave.',
      eval(){ const q=val('qssn');
        if (q==='Data not collected') return {ok:false, tag:'Incorrect — chose Data not collected', fb:'You did ask, and she told you no. "Data not collected" says the question never came up, which means the next worker will ask her again. She has already answered once.'};
        if (q==='Client prefers not to answer') return {ok:true, fb:'XXX-XX-XXXX in the field, and Client prefers not to answer. Declining is a legitimate answer and it gets recorded as one. Plenty of records hold no Social Security Number at all and they are still findable, which you proved to yourself last lesson.'};
        return {ok:false, fb:'She was asked, and she declined. That is Client prefers not to answer, with X’s in the number field. Any other code puts a different conversation on her record than the one you had.'}; } },

    { scen:'End of shift. A young man gives you his first and last name and then sees someone he knows across the lot and goes. You never got to the rest of it.',
      instr:'Create his profile with what you have.', hint:'Nothing was refused here, and nothing was forgotten. The questions were never asked.',
      eval(){ const a=val('qssn'), b=val('qdob');
        if (a==="Client doesn't know" || b==="Client doesn't know") return {ok:false, tag:'Incorrect — chose Client doesn’t know', fb:'He never said he did not know, because you never asked him. Recording him as unable to answer puts a fact on his record that is not true, and it is a fact the next worker will believe.'};
        if (a==='Data not collected' && b==='Data not collected') return {ok:true, fb:'Data not collected. It is the honest answer and it is not a mistake. It tells the next person exactly what to do, which is ask. Be clear about what happens next, though. Data not collected shows on the Data Quality Dashboard as an error, not a warning, because a required question was never asked. It stays an error until somebody asks him. That is not the dashboard telling you that you did something wrong. It is the dashboard making sure the question does not stay unasked forever. The alternative, picking Client doesn’t know to make the error go away, would clear the dashboard and put a lie on his record. The honest error is the right call.'};
        return {ok:false, fb:'You have his name and nothing else, because he left before you asked. The only honest code for the date of birth and the Social Security Number is Data not collected. It flags on the dashboard until somebody asks, and that is the point.'}; } },

    { scen:'A man gives his name as Roland Pike and spells it. Then he laughs and says nobody has called him that since the nineties. Out here he is Cadillac. If you ask anyone about Roland Pike, he says, they will look at you blankly.',
      instr:'Create his profile so that the next worker can find him under either name.', hint:'Both names belong on this record. They go in different places.',
      eval(){ const al=val('alias');
        if (!al) return {ok:false, tag:'Incorrect — Alias left blank', fb:'You have created a perfectly accurate record for a name that nobody will ever search. Roland Pike is on his ID and Cadillac is the name he goes by, and the next outreach worker is going to hear the second one. This is exactly how Lefty Torres happened. Somebody typed Michael Torres correctly, left this field empty, and a search years later came back with nothing.'};
        return {ok:true, fb:'Roland Pike in the name fields, Cadillac in the alias. Both are now searchable, and neither one being empty is an accident anyone has to recover from later. Ask everyone this. Not just the people who volunteer it. A middle name, a second last name, a nickname, a shortened name, a name they used to go by. Confirm the spelling of each one, and then address them by whichever name they gave you first.'}; } },

    { scen:'You are completing the demographics section for a participant who is standing in front of you, waiting.',
      instr:'Complete Gender and Race and Ethnicity.', hint:'There is only one way to find out.', ask:true,
      askText:'You ask. "What would you say is your gender identity?" She says woman, and adds that she uses she and her. "And what would you say is your race or ethnicity?" She says Hispanic.',
      eval(){ if (this.touchedBeforeAsk) return {ok:false, tag:'Incorrect — selected without asking', fb:'You cannot see any of this. Not one field in this section is something you can determine by looking at somebody, and a confident wrong answer is worse than an honest gap, because nobody downstream knows to question it.'};
        if (!this.asked) return {ok:false, tag:'Incorrect — selected without asking', fb:'You cannot see any of this. Not one field in this section is something you can determine by looking at somebody, and a confident wrong answer is worse than an honest gap, because nobody downstream knows to question it.'};
        return {ok:true, fb:'You asked. That is the whole skill. It is also the rule. LAHSA’s data quality standards say it plainly: collect data directly from participants, and do not enter data about participants based on your observations. Pronouns are not required by the form. Fill them in anyway. It is the field most likely to change how the next worker speaks to this person, and it costs one question.'}; } },

    { scen:'You are on the street with a participant who has given you everything you asked for. You explain that other agencies using HMIS would be able to see her record, and she says that is fine. You have your phone and nothing else. No tablet, no paper form.',
      instr:'Record her consent.', hint:'She said yes. You have no way for her to sign. There is an option for exactly this.',
      eval(){ const p=val('perm'), d=val('doc');
        if (d==='Electronic Signature') return {ok:false, tag:'Incorrect — chose Electronic Signature', fb:'Electronic Signature needs a screen she can sign on, and you do not have one. Picking it here means either she signs nothing, or you sign for her. Neither of those is her consent.'};
        if (p==='No') return {ok:false, tag:'Incorrect — set Permission to No', fb:'She said yes. Recording a no because you could not get a signature today puts an answer on her record that she did not give, and it stops the next agency from seeing her until somebody fixes it.'};
        if (p==='Yes' && d==='Verbal Consent') return {ok:true, fb:'Permission Yes, Documentation Verbal Consent. Her yes is real and it counts today. What you owe her now is the follow-up. Verbal Consent is consent with a plan attached, and the plan is that you come back with something she can sign.'};
        return {ok:false, fb:'She said yes out loud, with nothing to sign on. That is Permission Yes and Documentation Verbal Consent, and a plan to come back for a written signature.'}; } },

    { scen:'A man has given you his name, date of birth, and the last four of his Social Security Number. Then he stops. He says he has thought about it, and he does not want any of his personal information in the system. Not his name, not his birthday, none of it. He still wants help.',
      instr:'Record his decision and create the profile.', hint:'He is not asking who can see his information. He is asking that it not be there.', skip:true,
      eval(){ if (FORM.refused()) return {ok:true, fb:'Consent Refused. The form replaced his name with Generated Refused, his Social Security Number with zeros, and his date of birth with January 1, and it set the quality codes to match. The record exists. He can be enrolled and served. What is not in there is anything that identifies him, which is exactly what he asked for. This is the only situation that toggle is for. Everything else is a Permission answer.'};
        if (val('perm')==='No') return {ok:false, tag:'Incorrect — set Permission to No and left his details in place', fb:'Permission No controls which agencies can see his information. His name and date of birth are still sitting on the record. He asked for none of it to be there. That is a different request, and there is a different control for it.'};
        return {ok:false, fb:'He asked that none of his identifying information be in the system at all. That is the Consent Refused toggle, in the identity section. It replaces his details with placeholders and still lets you create the record and serve him.'}; },
      skipFb:{tag:'Incorrect — did not create a profile', fb:'He still wants help, and anyone who receives services needs a profile. Refusing to have his identifying information in HMIS does not mean he cannot be served. It means the record has to be built differently.'} },
  ];

  // ---------- flow ----------
  /* The panel carries the standing brief and the controls. The reaction is hers,
     and it is delivered next to whatever caused it — the same division as Lesson 1.
     There is no feedback box in the panel any more: a paragraph that appears in a
     window on the far side of the screen from the field it is about makes the
     learner look away from the thing they got wrong. */
  const ASK_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h11"/></svg>';
  let i=-1, cur=null, answered=false;
  const B = {start:$('start'),hint:$('hintbtn'),ask:$('askbtn'),cont:$('contbtn'),skip:$('skipbtn'),next:$('nextbtn'),replay:$('replay')};
  const show=(el,on)=>el.hidden=!on;
  const brief=html=>{ $('tBrief').innerHTML=html; $('tBrief').hidden=!html; };
  const asks =html=>{ $('tAsk').innerHTML=html?ASK_ICON+'<span>'+html+'</span>':''; $('tAsk').hidden=!html; };
  function load(n){
    i=n; cur=T[n]; answered=false; cur.asked=false; cur.touchedBeforeAsk=false; cur.snap=null;
    resetForm();
    LZ.hush();
    $('taskNo').textContent=`Task ${n+1} of ${T.length}`;
    $('prog').textContent=`${n+1} / ${T.length}`;
    $('barFill').style.width=(n/T.length*100)+'%';
    brief(cur.scen);
    asks('<b>Your task:</b> '+esc(cur.instr));
    $('stage2').textContent=cur.stage2||''; show($('stage2'),false);
    show(B.start,false); show(B.hint,true); show(B.ask,!!cur.ask); show(B.cont,!!cur.stage2); show(B.skip,!!cur.skip); show(B.next,false);
    $('save').disabled=false;
  }
  /* Where she stands to say it. A task may name the field its feedback is about;
     otherwise she goes to Save, which is the control they just pressed. Never the
     whole form — an arrow cannot point at a 600x800 block, and the solver has
     nowhere to stand beside one. */
  function say(kind,title,body,at){
    const look = kind==='good' ? {eyes:'sparkle',mouth:'cheer',move:'bounce'}
                               : {eyes:'glance', mouth:'wry',  move:'shrug'};
    LZ.say(at||'save',
      '<div class="fb '+kind+'"><b>'+esc(title)+'</b>'+
      body.split(/\n+/).map(t=>'<p>'+t+'</p>').join('')+'</div>', look);
  }
  function feedback(r){
    answered=true;
    say(r.ok?'good':'bad', r.ok?'Correct':(r.tag||'Not this one'), r.fb, cur.at);
    show(B.hint,false); show(B.ask,false); show(B.cont,false); show(B.skip,false); show(B.next,true);
    B.next.textContent = i>=T.length-1 ? 'Finish' : 'Next task →';
    $('barFill').style.width=((i+1)/T.length*100)+'%';
    $('save').disabled=true;
    pulseWin();
    LZ.actions([{t: i>=T.length-1 ? 'Finish' : 'Next task →', fn:()=>B.next.click()}]);
  }
  /* The window is small and can be anywhere on screen, so when something lands in
     it that the learner needs, it says so once rather than waiting to be noticed. */
  function pulseWin(){ const w=$('coachWin'); w.classList.remove('pulse'); void w.offsetWidth; w.classList.add('pulse'); }
  B.start.onclick=()=>load(0);
  B.hint.onclick=()=>{
    say('tip','Hint',cur.hint,cur.at);
    LZ.actions([{t:'Hide hint', quiet:true, fn:()=>LZ.hush()}]);
  };
  B.cont.onclick=()=>{ cur.onCont && cur.onCont(); show($('stage2'),true); show(B.cont,false); };
  B.ask.onclick=()=>{ cur.asked=true; $('stage2').textContent=cur.askText; show($('stage2'),true); show(B.ask,false); };
  ['gender','race','pronouns'].forEach(id=>$(id).addEventListener('change',()=>{ if(cur&&cur.ask&&!cur.asked) cur.touchedBeforeAsk=true; }));
  B.skip.onclick=()=>feedback({ok:false, ...cur.skipFb});
  $('save').onclick=()=>{ if(!cur||answered) return; const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1200); feedback(cur.eval()); };
  $('cancel').onclick=()=>{ if(cur&&!answered) resetForm(); };
  B.next.onclick=()=>{ if (i<T.length-1) load(i+1); else finish(); };
  function finish(){
    LZ.hush();
    $('taskNo').textContent='Simulator complete'; $('prog').textContent='';
    $('barFill').style.width='100%';
    show($('stage2'),false);
    brief(`<b>Nine records that did not exist twenty minutes ago.</b> You told apart the three different reasons a field can be empty, which is the part most people never get right. You kept a year of birth that a careless code would have thrown away. You recorded a name nobody would have thought to search for, and one that everybody will. You recorded consent the way it actually happened, including once when it happened out loud on a sidewalk. And you told the difference between someone who wants to control who sees their information and someone who does not want it there at all. None of it took information the participant could not give you standing on a sidewalk.`);
    asks('');
    show(B.next,false); show(B.replay,true);
    /* The house contract: source-tagged, and never a score. */
    try{ window.parent.postMessage({source:'hmis-sim',lesson:'hmis-bnts-create',
      section:'add-client',type:'complete'},'*'); }catch(e){}
  }
  B.replay.onclick=()=>location.reload();

  /* Her layer has to be mounted before anything asks her to say something. */
  LZ.boot();

  // First screen
  $('secTitle').textContent='Practice: Creating a Profile';
  $('taskNo').textContent='Welcome back';
  brief('The plus is lit up now. Last lesson it was dimmed, along with most of this screen. Each lesson clears the part it teaches, and this is yours.<br><br>Nothing here is scored. If you pick something I would not have picked, I will tell you why, and then we carry on to the next one. Nobody is keeping count and there is nothing to fail.<br><br>And I am never going to check your spelling. Type it however it comes out. What I would ask is that you check it with the person in front of you, which is a completely different thing, and it is the one that matters.');
  asks('Nine people, nine records.');
  try{ window.parent.postMessage({source:'hmis-sim',lesson:'hmis-bnts-create',
    section:'add-client',type:'ready'},'*'); }catch(e){}
})();

/*__PANEL_JS__*/
</script>
</body>
</html>
