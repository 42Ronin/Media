  <!-- The bar and nothing else. The label and the step count were both taken out:
       a conversation does not announce how many turns it has left, and "Bobbi
       speaks, you fill the form" is an instruction, which is what this page is
       built to do without. -->
  <div class="chead">
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <!-- The transcript is what this page is, so it takes the window's whole body
       rather than sitting in a box inside it. -->
  <div class="cbody log" id="log" aria-live="polite"></div>
  <div class="cfoot">
    <button class="cbtn go" id="next">Let’s go</button>
    <button class="cbtn" id="replay" hidden>Replay</button>
  </div>
