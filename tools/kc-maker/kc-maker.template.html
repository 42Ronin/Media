<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge check maker</title>
<!--
  Authoring tool for the card knowledge check.

  One HTML file. Open it in a browser; nothing is installed, nothing is uploaded,
  and it fetches nothing — the page it exports is carried inside it, base64'd into
  the empty #page script at build time by make_maker.py, so the maker can never
  ship a stale copy of the lesson page.

  Write the questions, press Export. The exported page is the same one the lesson
  ships: cards dealt face down, one pick, feedback over the hand, and a completion
  that is withheld until the pass mark is cleared.
-->
<style>
:root{
  --teal:#066888; --teal-dk:#044e66; --teal-lt:#3fa0c0;
  --ink:#14222b; --mut:#5f7f8f; --line:#d9e8ef; --line-2:#eaf2f6;
  --felt:#f1f8fb; --paper:#fff;
  --ok:#0f6b45; --ok-soft:#e8f5ee; --bad:#a3312a; --bad-soft:#fbeae9;
  --focus:#0b6fd4;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0;height:100%}
body{font:14.5px/1.55 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:#f6fafc;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:5px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--paper);border-bottom:1px solid var(--line)}
.bar .brand{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--teal);
  font-size:15.5px;white-space:nowrap}
.bar .brand svg{width:32px;height:32px;display:block;overflow:visible}
.grow{flex:1}
.field{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.field input[type=text]{width:230px;padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff}
.field input[type=number]{width:64px;padding:7px 8px;border:1px solid var(--line);
  border-radius:8px;background:#fff}
.field label{white-space:nowrap}
.field select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{background:var(--teal);color:#fff;border-radius:9px;padding:9px 16px;font-weight:600;
  font-size:14px;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--teal-dk)}
.btn[disabled]{background:#b9ccd6;cursor:not-allowed}
.btn.quiet{background:none;color:var(--teal);box-shadow:inset 0 0 0 1px var(--line)}
.btn.quiet:hover{background:var(--felt);color:var(--teal-dk)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:7px}

/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0}
.side{flex:none;width:250px;border-right:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;min-height:0}
.side h2{margin:0;padding:13px 15px 9px;font-size:12px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mut)}
.qlist{flex:1;overflow:auto;padding:0 9px 9px}
.qitem{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;margin-bottom:3px;border:1px solid transparent}
.qitem:hover{background:var(--felt)}
.qitem.on{background:var(--felt);border-color:var(--line);font-weight:600}
.qitem .n{flex:none;width:21px;height:21px;border-radius:6px;background:var(--line-2);
  color:var(--mut);font-size:11.5px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.qitem.on .n{background:var(--teal);color:#fff}
.qitem.bad .n{background:var(--bad-soft);color:var(--bad)}
.qitem .t{flex:1;min-width:0;font-size:13.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem .t.empty{color:var(--mut);font-style:italic}
.sidefoot{flex:none;padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}

.main{flex:1;overflow:auto;padding:20px 24px 40px;min-width:0}
.pane{max-width:760px}
.pane h3{margin:0 0 3px;font-size:17px}
.pane .sub{margin:0 0 18px;color:var(--mut);font-size:13.5px}
label.lab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);font-weight:700;margin:0 0 6px}
/* A rich field is a contenteditable dressed as the textarea it replaces, so the
   editor looks the same whether a field takes markup or not. */
.rich{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;color:inherit;line-height:1.55;overflow-wrap:anywhere;
  white-space:pre-wrap;outline:0}
.rich:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(6,104,136,.13)}
.rich:empty::before{content:attr(data-ph);color:#93a9b4}
.rich.q{min-height:74px;font-size:15.5px}
.rich.fb{min-height:96px}
.rich[contenteditable="false"]{background:#f4f7f9;color:#8ea3ae}
.rich a{color:var(--teal);font-weight:600}
.ans .rich{min-height:46px;flex:1}
.ans.correct .rich{border-color:var(--ok);background:var(--ok-soft)}
/* the toolbar */
.tools{display:flex;gap:4px;align-items:center;margin:0 0 7px}
.tools button{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);
  background:#fff;font-size:13px;line-height:1;color:var(--ink);display:grid;place-items:center}
.tools button:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.tools button:disabled{opacity:.35;cursor:not-allowed}
.tools .b{font-weight:800}.tools .i{font-style:italic}
.tools .u{text-decoration:underline}.tools .s{text-decoration:line-through}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fff;resize:vertical;line-height:1.5}
textarea.q{min-height:74px;font-size:15.5px}
textarea.fb{min-height:96px}
.blk{margin-bottom:22px}

/* answers */
.ans{display:flex;gap:11px;align-items:flex-start;margin-bottom:9px}
.ans .pick{flex:none;margin-top:9px;display:flex;align-items:center;gap:7px}
.ans .letter{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line-2);
  color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:8px}
.ans.correct .letter{background:var(--ok);color:#fff}
.ans textarea{min-height:46px}
.ans.correct textarea{border-color:var(--ok);background:var(--ok-soft)}
.ans .kill{flex:none;margin-top:7px;width:28px;height:28px;border-radius:7px;color:var(--mut);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.ans .kill:hover{background:var(--bad-soft);color:var(--bad)}
.ans .kill[disabled]{opacity:.3;cursor:not-allowed}
.ans .kill[disabled]:hover{background:none;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut);
  margin:0 0 8px;cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
textarea[disabled]{background:var(--line-2);color:var(--mut);cursor:not-allowed}

/* ---------- validation ---------- */
.probs{flex:none;background:var(--bad-soft);border-top:1px solid #f0cfcc;color:var(--bad);
  padding:10px 18px;font-size:13.5px}
.probs ul{margin:5px 0 0;padding-left:20px}
.probs li{margin:2px 0}
.okline{flex:none;background:var(--ok-soft);border-top:1px solid #cbe6d8;color:var(--ok);
  padding:10px 18px;font-size:13.5px;font-weight:600}

/* ---------- preview ----------
   The frame gets a WHITE ground of its own. Every one of these pages is
   transparent on purpose, because in Rise the page behind it belongs to Rise —
   previewing one over the editor's own grey would be showing it on a background
   it will never have. */
.prevwrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  background:rgba(20,34,43,.55)}
.prevbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--teal-dk);color:#fff;font-size:13.5px}
.prevframe{flex:1;width:100%;border:0;background:#fff}
/* The quiet button is teal on white everywhere else in the tool; on this bar that
   is teal on dark teal. */
.prevbar .btn.quiet{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.prevbar .btn.quiet:hover{background:rgba(255,255,255,.14);color:#fff}

/* the character, drawn as the lesson draws her */
.m-rim{fill:none;stroke:#066888;stroke-width:6}
.m-glass{fill:#e0eff5}
.m-eye{fill:#14222b}
.m-lash path{fill:none;stroke:#14222b;stroke-width:2.2;stroke-linecap:round}
.m-mouth{fill:none;stroke:#14222b;stroke-width:3;stroke-linecap:round}
.m-shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.85}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="m-rim" cx="44" cy="42" r="30"/>
      <circle class="m-glass" cx="44" cy="42" r="25"/>
      <circle class="m-eye" cx="35" cy="39" r="4"/><circle class="m-eye" cx="53" cy="39" r="4"/>
      <g class="m-lash">
        <path d="M30.5 34.5 l-3 -2.5"/><path d="M34.5 33.2 l-1 -3"/><path d="M38.5 34 l1.5 -2.8"/>
        <path d="M48.5 34 l-1.5 -2.8"/><path d="M52.5 33.2 l1 -3"/><path d="M56.5 34.5 l3 -2.5"/>
      </g>
      <path class="m-mouth" d="M36 51 q8 7 16 0"/>
      <path class="m-shine" d="M27 30 q7-9 17-10"/>
    </svg>
    Knowledge check maker
  </span>

  <span class="field">
    <label for="kind">Type</label>
    <select id="kind"><!--KINDS--></select>
  </span>
  <span class="field">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="lesson-1-knowledge-check">
  </span>
  <!-- Both of these belong to the scored check and are hidden for a type that has
       no mark to clear and only one staging to ship. -->
  <span class="field" id="passField">
    <label for="pass">Pass mark</label>
    <input type="number" id="pass" min="0" max="100" step="5" value="80">%
  </span>
  <span class="field" id="themeField">
    <label for="theme">Theme</label>
    <select id="theme"></select>
  </span>

  <span class="grow"></span>

  <button class="btn quiet small" id="preview">Preview</button>
  <button class="btn quiet small" id="saveProj">Save project</button>
  <button class="btn quiet small" id="openProj">Open project</button>
  <button class="btn" id="expHTML">Export HTML</button>
  <button class="btn" id="expZIP">Export ZIP</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</div>

<div class="body">
  <!-- A Copperfield is one box, not a deck, so there is no list to move around
       in and no count to set. A series of them is several exports, each embedded
       on its own slide. -->
  <div class="side" id="side">
    <h2>Questions</h2>
    <div class="qlist" id="qlist" role="tablist" aria-label="Questions"></div>
    <div class="sidefoot">
      <button class="btn small" id="addQ">Add question</button>
      <span class="field"><label for="total" class="sr-only">Total questions</label>
        <input type="number" id="total" min="1" max="40" title="Total questions"></span>
    </div>
  </div>

  <div class="main">
    <div class="pane" id="pane"></div>
  </div>
</div>

<div class="probs" id="probs" hidden></div>
<div class="okline" id="okline" hidden></div>

<!-- The preview: the real exported page, in a frame, over the editor. It is the
     only way the theme selector shows its work — everything else about a theme
     lives in the page, not in here. -->
<div class="prevwrap" id="prevwrap" hidden>
  <div class="prevbar">
    <b id="prevname">Preview</b>
    <span class="grow"></span>
    <button class="btn quiet small" id="prevClose">Close</button>
  </div>
  <iframe class="prevframe" id="prevframe" title="Preview"></iframe>
</div>

<!-- One knowledge-check page per theme, base64'd in at build time. -->
<!--PAGES-->
<script>
var $=function(s){return document.querySelector(s)};
var LETTER=["A","B","C","D","E"];
/* Assembled rather than written out, so this file never contains the literal the
   build scripts search for. */
var TOKEN="/*"+"__KC__"+"*/";
var STORE="kc-maker/v1";

/* ============================================================
   The kinds

   `kc` is the scored card check: a deck, a pass mark, one correct answer per
   question. `copperfield` is a single interactive box that only looks like a
   question — every answer is taken in turn and vanishes, and what is under
   them is the point. Nothing about it is scored, so it has no correct answer
   and no mark, and it is one question rather than a deck.

   RULES is the difference in one place. Everything else in the editor asks it
   rather than naming a kind.
   ============================================================ */
var RULES={
  kc:{ minA:3, maxA:5, deck:true, correct:true, mark:true, needFb:false,
       pane:"The learner sees the question, then three to five cards dealt face "+
            "down. They turn over together and the learner picks one.",
       answers:"Answers &mdash; mark the one that is correct",
       hint:"The order is shuffled on every deal, so it does not matter which one "+
            "you write first.",
       fbLab:"Feedback",
       fbPlace:"Written for the question as a whole — it is what they read once they "+
               "have answered, whichever way they answered.",
       fbHint:"Off, the cards are still marked right and wrong and the learner goes "+
              "straight on. What is written here is kept either way." },
  copperfield:{ minA:2, maxA:3, deck:false, correct:false, mark:false, needFb:true,
       pane:"The learner sees the question and two or three answers. Resting on one "+
            "disintegrates it; when the last has gone, the question goes with it and "+
            "what is written below is what is left. Nothing here is right or wrong.",
       answers:"Answers &mdash; resting on one takes it",
       hint:"Every one of these is read and then cleared, so write things worth "+
            "reading rather than wrong options.",
       fbLab:"What is under them",
       fbPlace:"What the learner is left with once every answer has gone. This is the "+
               "point of the box, so it cannot be switched off.",
       fbHint:"Enter starts a new paragraph; Shift+Enter breaks a line." }
};
function rules(){ return RULES[proj.kind]||RULES.kc; }

/* ============================================================
   The project
   ============================================================ */
function blankQ(){ return {q:"", a:[{t:"",ok:true},{t:"",ok:false},{t:"",ok:false}], fb:"", nofb:false}; }
/* The pages are whatever the build put here, in the order it put them. Nothing
   in the editor names a kind or a theme — both are rows in make_maker.py. */
var PAGES=[].slice.call(document.querySelectorAll("script.page")).map(function(el){
  return {kind:el.dataset.kind, theme:el.dataset.theme, label:el.dataset.label, el:el};
});
function themesFor(kind){
  return PAGES.filter(function(p){ return p.kind===kind; });
}
var KINDS=PAGES.map(function(p){ return p.kind; })
  .filter(function(k,i,all){ return all.indexOf(k)===i; });
var proj={ kind:KINDS[0], name:"", pass:80, theme:themesFor(KINDS[0])[0].theme,
           questions:[blankQ()] };
var at=0;

function load(){
  var raw;
  try{ raw=localStorage.getItem(STORE); }catch(e){ return; }
  if(!raw) return;
  try{ adopt(JSON.parse(raw)); }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(proj)); }catch(e){}
}
/* Anything that looks like a project — from localStorage or an opened file. Both
   go through here so a hand-edited file cannot put the editor in a state its own
   controls could not reach. */
function adopt(o){
  if(!o||typeof o!=="object") return;
  var qs=Array.isArray(o.questions)?o.questions:[];
  /* An unknown kind or theme — an older project, written before either existed,
     or one edited by hand — falls back rather than exporting nothing. A project
     saved before there were kinds has none, and is the scored check. */
  proj.kind = KINDS.indexOf(o.kind)>=0 ? o.kind : KINDS[0];
  var themes=themesFor(proj.kind).map(function(p){ return p.theme; });
  proj.theme = themes.indexOf(o.theme)>=0 ? o.theme : themes[0];
  proj.name = typeof o.name==="string" ? o.name : "";
  proj.pass = Math.max(0,Math.min(100, Number(o.pass)||80));
  proj.questions = qs.length ? qs.map(function(q){
    var a=(Array.isArray(q.a)?q.a:[]).map(function(x){
      return {t:String(x&&x.t||""), ok:!!(x&&x.ok)};
    });
    return {q:String(q.q||""), a:a, fb:String(q.fb||""), nofb:!!q.nofb};
  }) : [blankQ()];
  fit();
}
/* Bring the questions inside the current kind's rules. Called after adopting a
   project and after a change of kind, because the two kinds do not agree on how
   many answers there are, whether one of them is correct, or whether there is
   more than one question. Trimming is by truncation, never by rewriting what
   somebody typed: a fourth answer dropped by switching to Copperfield comes
   back by switching to a kind that allows one only if it was not saved over. */
function fit(){
  var r=rules();
  if(!r.deck) proj.questions=proj.questions.slice(0,1);
  proj.questions.forEach(function(q){
    if(q.a.length>r.maxA) q.a=q.a.slice(0,r.maxA);
    while(q.a.length<r.minA) q.a.push({t:"",ok:false});
    if(r.correct && !q.a.some(function(x){return x.ok})) q.a[0].ok=true;
    if(r.needFb) q.nofb=false;
  });
  at=Math.max(0, Math.min(at, proj.questions.length-1));
}

/* ============================================================
   Render
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderList(){
  var bad=problemsByQuestion();
  $("#qlist").innerHTML=proj.questions.map(function(q,i){
    var t=plain(q.q);
    return '<button class="qitem'+(i===at?" on":"")+(bad[i]?" bad":"")+'" role="tab" '+
             'aria-selected="'+(i===at)+'" data-i="'+i+'" type="button">'+
             '<span class="n">'+(i+1)+'</span>'+
             '<span class="t'+(t?"":" empty")+'">'+esc(t||"Empty question")+'</span>'+
           '</button>';
  }).join("");
  $("#total").value=proj.questions.length;
}

/* ============================================================
   Rich text in the editor

   Bold, italic, underline, strikethrough and links. Deliberately NOT a general
   HTML field: what is stored is a plain string carrying only those five things,
   which keeps the project file readable, keeps it a string in JSON, and means a
   paste from Word cannot bring a mountain of markup in with it.

   The pages sanitise again on the way in. That is the actual guarantee — this
   is the convenience, and a hand-edited project has to be safe too.
   ============================================================ */
var TAGS={B:"b",STRONG:"b",I:"i",EM:"i",U:"u",S:"s",STRIKE:"s",DEL:"s"};
var LINKOK=/^(https?:|mailto:)/i;

function TOOLBAR(id,links){
  return '<div class="tools" data-for="'+id+'">'+
    '<button type="button" class="b" data-cmd="bold" title="Bold">B</button>'+
    '<button type="button" class="i" data-cmd="italic" title="Italic">I</button>'+
    '<button type="button" class="u" data-cmd="underline" title="Underline">U</button>'+
    '<button type="button" class="s" data-cmd="strikeThrough" title="Strikethrough">S</button>'+
    (links ? '<span class="sep"></span>'+
      '<button type="button" data-cmd="link" title="Link">&#128279;</button>'+
      '<button type="button" data-cmd="unlink" title="Remove link">&#9003;</button>' : '')+
  '</div>';
}

/* contenteditable -> the stored string. One top-level block per paragraph,
   joined by a blank line, which is the format the pages already read. */
function readRich(el){
  var out=[];
  function inline(node){
    var s="";
    for(var n=node.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3){ s+=escText(n.nodeValue); continue; }
      if(n.nodeType!==1) continue;
      var tag=n.tagName.toUpperCase();
      if(tag==="BR"){ s+="\n"; continue; }
      if(tag==="A"){
        var href=n.getAttribute("href")||"";
        s += LINKOK.test(href)
          ? '<a href="'+escText(href)+'">'+inline(n)+'</a>'
          : inline(n);
        continue;
      }
      if(TAGS[tag]){ s+="<"+TAGS[tag]+">"+inline(n)+"</"+TAGS[tag]+">"; continue; }
      s+=inline(n);
    }
    return s;
  }
  var loose=null;
  function flush(){ if(loose!==null){ out.push(loose); loose=null; } }
  for(var n=el.firstChild;n;n=n.nextSibling){
    if(n.nodeType===1 && /^(DIV|P)$/.test(n.tagName)){ flush(); out.push(inline(n)); continue; }
    if(n.nodeType===1 && n.tagName==="BR"){ if(loose===null) loose=""; loose+="\n"; continue; }
    var frag=document.createElement("span"); frag.appendChild(n.cloneNode(true));
    if(loose===null) loose="";
    loose+=inline(frag);
  }
  flush();
  return out.join("\n\n").replace(/\n{3,}/g,"\n\n").replace(/^\s+|\s+$/g,"");
}
function escText(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ...and back the other way, for opening a project. Sanitised on the way in so a
   hand-edited file cannot put anything into the editor either. */
function writeRich(el,s){
  el.innerHTML="";
  var chunks=String(s||"").split(/\n{2,}/);
  chunks.forEach(function(chunk){
    var d=document.createElement("div");
    var doc=new DOMParser().parseFromString(chunk.replace(/\n/g,"<br>"),"text/html");
    (function walk(from,to){
      for(var n=from.firstChild;n;n=n.nextSibling){
        if(n.nodeType===3){ to.appendChild(document.createTextNode(n.nodeValue)); continue; }
        if(n.nodeType!==1) continue;
        var tag=n.tagName.toUpperCase();
        if(tag==="BR"){ to.appendChild(document.createElement("br")); continue; }
        if(tag==="A"){
          var href=n.getAttribute("href")||"";
          if(LINKOK.test(href)){ var a=document.createElement("a"); a.setAttribute("href",href);
            walk(n,a); to.appendChild(a); continue; }
          walk(n,to); continue;
        }
        if(TAGS[tag]){ var e=document.createElement(TAGS[tag]); walk(n,e); to.appendChild(e); continue; }
        walk(n,to);
      }
    })(doc.body,d);
    el.appendChild(d);
  });
  if(!el.firstChild) el.appendChild(document.createElement("div"));
}

/* One handler for every toolbar. execCommand is deprecated and is still the only
   thing that edits a selection inside contenteditable without writing a whole
   editor, so it stays — and whatever it produces is normalised by readRich on
   the way out anyway. */
document.addEventListener("mousedown",function(e){
  var btn=e.target.closest(".tools button");
  if(!btn) return;
  e.preventDefault();                       /* keep the selection in the field */
  /* Whichever field has focus, so one toolbar can serve a row of answers. The
     mousedown default is prevented above, which is what keeps the focus (and the
     selection) in the field while the button is pressed. */
  var live=document.activeElement;
  var host=(live && live.classList && live.classList.contains("rich")) ? live
         : $("#"+btn.closest(".tools").dataset.for);
  if(!host || host.getAttribute("contenteditable")==="false") return;
  host.focus();
  var cmd=btn.dataset.cmd;
  if(cmd==="link"){
    var url=(prompt("Link address")||"").trim();
    if(!url) return;
    if(!LINKOK.test(url)) url="https://"+url.replace(/^\/+/,"");
    if(!LINKOK.test(url)) return;
    document.execCommand("createLink",false,url);
  } else if(cmd==="unlink"){
    document.execCommand("unlink",false,null);
  } else {
    document.execCommand(cmd,false,null);
  }
  host.dispatchEvent(new Event("input",{bubbles:true}));
});
/* Paste as plain text. Whatever came off the clipboard is somebody else's
   markup, and the five things this field keeps are applied here, not imported. */
document.addEventListener("paste",function(e){
  var host=e.target.closest && e.target.closest(".rich");
  if(!host) return;
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText",false,t);
});

function renderPane(){
  var q=proj.questions[at], r=rules();
  if(!q){ $("#pane").innerHTML=""; return; }
  $("#pane").innerHTML=
    '<h3>'+(r.deck ? 'Question '+(at+1)+' of '+proj.questions.length : 'The box')+'</h3>'+
    '<p class="sub">'+r.pane+'</p>'+
    '<div class="blk"><label class="lab" for="qtext">Question</label>'+
      TOOLBAR("qtext",true)+
      '<div id="qtext" class="rich q" contenteditable="true" '+
        'data-ph="What does an empty result actually tell you?"></div></div>'+
    '<div class="blk"><label class="lab">'+r.answers+'</label>'+
      /* One toolbar for the row: it works on whichever answer has focus. No link
         button — an answer is taken by resting on it, so a link inside one could
         never be clicked. */
      TOOLBAR("answers",false)+
      '<div id="answers"></div>'+
      '<p class="hint">Between '+r.minA+' and '+r.maxA+'. '+r.hint+'</p>'+
      '<button class="btn quiet small" id="addA" style="margin-top:8px">Add answer</button></div>'+
    '<div class="blk"><label class="lab" for="fbtext">'+r.fbLab+'</label>'+
      (r.needFb ? '' :
        '<label class="switch"><input type="checkbox" id="fbon"'+(q.nofb?"":" checked")+'>'+
          '<span>Show feedback for this question</span></label>')+
      TOOLBAR("fbtext",true)+
      '<div id="fbtext" class="rich fb" contenteditable="'+(q.nofb?"false":"true")+'" '+
        'data-ph="'+esc(r.fbPlace)+'"></div>'+
      '<p class="hint">'+r.fbHint+'</p></div>';
  writeRich($("#qtext"), q.q);
  writeRich($("#fbtext"), q.fb);
  /* Turning it off keeps the writing. Someone who switches it off, exports, and
     switches it back should not find their paragraph gone. */
  /* Turning it off keeps the writing. A kind whose whole point is what is under
     the answers has no switch at all. */
  if($("#fbon")) $("#fbon").addEventListener("change",function(){
    q.nofb=!this.checked;
    $("#fbtext").setAttribute("contenteditable", q.nofb?"false":"true");
    touch(true);
  });
  $("#qtext").addEventListener("input",function(){ q.q=readRich(this); touch(true); });
  $("#fbtext").addEventListener("input",function(){ q.fb=readRich(this); touch(false); });
  $("#addA").addEventListener("click",function(){
    if(q.a.length>=rules().maxA) return;
    q.a.push({t:"",ok:false}); touch(true); renderPane();
  });
  renderAnswers();
}

function renderAnswers(){
  var q=proj.questions[at], host=$("#answers"), r=rules();
  host.innerHTML=q.a.map(function(a,i){
    return '<div class="ans'+(r.correct&&a.ok?" correct":"")+'" data-i="'+i+'">'+
      '<span class="letter">'+LETTER[i]+'</span>'+
      (r.correct
        ? '<span class="pick"><input type="radio" name="correct" id="ok'+i+'" '+(a.ok?"checked":"")+'>'+
            '<label for="ok'+i+'" class="sr-only">Answer '+LETTER[i]+' is correct</label></span>'
        : '')+
      '<div class="rich" contenteditable="true" data-a="'+i+'" '+
        'data-ph="Answer '+LETTER[i]+'"></div>'+
      '<button class="kill" data-kill="'+i+'" type="button" title="Remove this answer" '+
        (q.a.length<=r.minA?"disabled":"")+' aria-label="Remove answer '+LETTER[i]+'">&times;</button>'+
    '</div>';
  }).join("");
  [].forEach.call(host.querySelectorAll(".rich"),function(t){
    writeRich(t, q.a[+t.dataset.a].t);
    t.addEventListener("input",function(){ q.a[+this.dataset.a].t=readRich(this); touch(false); });
  });
  [].forEach.call(host.querySelectorAll("input[type=radio]"),function(rd,i){
    rd.addEventListener("change",function(){
      q.a.forEach(function(x,j){ x.ok=(j===i); });
      touch(false); renderAnswers();
    });
  });
  [].forEach.call(host.querySelectorAll(".kill"),function(b){
    b.addEventListener("click",function(){
      var i=+this.dataset.kill;
      if(q.a.length<=rules().minA) return;
      var wasOk=q.a[i].ok;
      q.a.splice(i,1);
      if(rules().correct && wasOk) q.a[0].ok=true;
      touch(true); renderPane();
    });
  });
}

/* `relist` because the sidebar shows the question text and the problem marks —
   it only needs redrawing when one of those could have changed. */
function touch(relist){ save(); validate(); if(relist) renderList(); }

/* ============================================================
   Validation — say what is missing rather than exporting something broken
   ============================================================ */
/* Emptiness is about WORDS, not markup: a field holding only an empty bold tag
   has nothing in it, however long the string is. */
function plain(s){
  return String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ")
                      .replace(/&amp;/g,"&").replace(/\s+/g," ").trim();
}
function problemsByQuestion(){
  var bad={}, r=rules();
  proj.questions.forEach(function(q,i){
    var filled=q.a.filter(function(a){ return plain(a.t); });
    if(!plain(q.q) || ((r.needFb||!q.nofb) && !plain(q.fb)) || filled.length<r.minA ||
       filled.length!==q.a.length ||
       (r.correct && q.a.filter(function(a){return a.ok}).length!==1)) bad[i]=true;
  });
  return bad;
}
function problems(){
  var out=[], r=rules();
  proj.questions.forEach(function(q,i){
    var n=r.deck ? "Question "+(i+1)+": " : "";
    if(!plain(q.q)) out.push(n+"no question written.");
    var blank=q.a.filter(function(a){ return !plain(a.t); }).length;
    if(blank) out.push(n+blank+" answer"+(blank>1?"s are":" is")+" blank.");
    /* Only a kind that has a right answer is asked for one. */
    if(r.correct && q.a.filter(function(a){ return a.ok; }).length!==1)
      out.push(n+"mark exactly one answer correct.");
    if((r.needFb||!q.nofb) && !plain(q.fb))
      out.push(n+(r.needFb ? "nothing written for what is under the answers."
                           : "no feedback written."));
  });
  if(!name()) out.push("Give it a name — that is what the exported files are called.");
  return out;
}
function validate(){
  var p=problems(), fine=!p.length;
  $("#probs").hidden=fine;
  $("#okline").hidden=!fine;
  if(!fine){
    $("#probs").innerHTML="<b>Not ready to export yet.</b><ul>"+
      p.map(function(s){ return "<li>"+esc(s)+"</li>"; }).join("")+"</ul>";
  }else if(rules().mark){
    var need=Math.ceil((proj.pass/100)*proj.questions.length);
    $("#okline").textContent=
      "Ready. "+proj.questions.length+" question"+(proj.questions.length===1?"":"s")+
      ", pass mark "+proj.pass+"% — the learner needs "+need+" of "+proj.questions.length+
      " right before the block reports itself complete.";
  }else{
    /* Nothing to clear: the gate is exhaustion. Say what actually finishes it,
       rather than borrowing the mark's sentence and leaving out the number. */
    var n=proj.questions[0].a.length;
    $("#okline").textContent=
      "Ready. One box, "+n+" answers — the block reports itself complete once the "+
      "learner has taken all "+n+". Nothing is scored.";
  }
  $("#expHTML").disabled=!fine;
  $("#expZIP").disabled=!fine;
  return fine;
}

/* ============================================================
   Export
   ============================================================ */
function name(){ return ($("#name").value||"").trim(); }
/* One safe basename, used for the .html, the .zip, and nothing else. The file
   inside the zip is always index.html, which is what Rise wants. */
function slug(){
  var s=name().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return s || "knowledge-check";
}
/* The page for the kind and theme now set. A kind with one staging still goes
   through here, so nothing has to know which kinds have a choice. */
function page(){
  var ts=themesFor(proj.kind);
  var hit=ts.filter(function(p){ return p.theme===proj.theme; })[0];
  return hit || ts[0];
}
function pageHTML(){
  var p=page();
  if(!p) throw new Error("no page for "+proj.kind+"/"+proj.theme);
  var b=p.el.textContent.trim();
  var bin=atob(b), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var tpl=new TextDecoder("utf-8").decode(bytes);
  var r=rules();
  var payload={
    title:name(),
    /* The Name is the filename. It is also the heading on a check, where a deck
       of questions is worth titling — but a Copperfield is ONE box sitting under
       a Rise slide that already has a title, and repeating it inside the block
       says the same thing twice. Same call as the task embeds. The page still
       supports a heading and still hides an empty one; this kind just never
       sends it. */
    heading:r.deck ? name() : "",
    questions:proj.questions.map(function(q){
      return {q:q.q.trim(),
              /* No `ok` where nothing is correct: a page that never reads it
                 should not be handed a field that says one answer beats another. */
              a:q.a.map(function(a){
                return r.correct ? {t:a.t.trim(), ok:!!a.ok} : {t:a.t.trim()};
              }),
              fb:(!r.needFb && q.nofb) ? "" : q.fb.trim()};
    })
  };
  if(r.mark) payload.pass=proj.pass/100;
  /* `</` escaped: this is stamped inside a script block, so a closing script
     tag in what somebody wrote or pasted would end that block early and break
     the export. `<\/` is an ordinary JS string escape and reads back the same.
     Note this comment does not spell the tag out — writing it here is what broke
     the maker once already. */
  var data=JSON.stringify(payload).replace(/<\//g,"<\\/");
  /* Exactly one, checked rather than assumed: the token used to be named in the
     page's own header comment as well, and replacing the first occurrence put the
     questions in a comment and left the real one empty. */
  var hits=tpl.split(TOKEN).length-1;
  if(hits!==1) throw new Error("the page template has "+hits+" KC tokens, expected exactly 1");
  return tpl.split(TOKEN).join(data);
}
function download(bytes,filename,type){
  var blob=new Blob([bytes],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* --- a minimal zip writer -------------------------------------------------
   Stored, not deflated. The whole point of this tool is that it fetches
   nothing, so pulling in a compression library is not an option — and a zip
   holding one HTML file does not need one. */
var CRC=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){ var c=n;
    for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0; }
  return t;
})();
function crc32(b){
  var c=0xFFFFFFFF;
  for(var i=0;i<b.length;i++) c=CRC[(c ^ b[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function zipOne(entry, bytes){
  var enc=new TextEncoder(), nameB=enc.encode(entry);
  var crc=crc32(bytes), n=bytes.length;
  var d=new Date();
  var time=((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()/2)&31);
  var date=(((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31);

  var local=new Uint8Array(30+nameB.length), lv=new DataView(local.buffer);
  lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true);
  lv.setUint16(6,0x0800,true);            /* names are UTF-8 */
  lv.setUint16(8,0,true);                 /* stored */
  lv.setUint16(10,time,true); lv.setUint16(12,date,true);
  lv.setUint32(14,crc,true); lv.setUint32(18,n,true); lv.setUint32(22,n,true);
  lv.setUint16(26,nameB.length,true); lv.setUint16(28,0,true);
  local.set(nameB,30);

  var cen=new Uint8Array(46+nameB.length), cv=new DataView(cen.buffer);
  cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
  cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
  cv.setUint16(12,time,true); cv.setUint16(14,date,true);
  cv.setUint32(16,crc,true); cv.setUint32(20,n,true); cv.setUint32(24,n,true);
  cv.setUint16(28,nameB.length,true);
  cv.setUint32(42,0,true);                /* one entry, so it starts at offset 0 */
  cen.set(nameB,46);

  var end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,1,true); ev.setUint16(10,1,true);
  ev.setUint32(12,cen.length,true);
  ev.setUint32(16,local.length+n,true);

  var out=new Uint8Array(local.length+n+cen.length+end.length), p=0;
  out.set(local,p); p+=local.length;
  out.set(bytes,p);  p+=n;
  out.set(cen,p);    p+=cen.length;
  out.set(end,p);
  return out;
}

$("#expHTML").addEventListener("click",function(){
  if(!validate()) return;
  download(pageHTML(), slug()+".html", "text/html;charset=utf-8");
});
$("#expZIP").addEventListener("click",function(){
  if(!validate()) return;
  var bytes=new TextEncoder().encode(pageHTML());
  download(zipOne("index.html", bytes), slug()+".zip", "application/zip");
});
$("#saveProj").addEventListener("click",function(){
  proj.name=name();
  download(JSON.stringify(proj,null,2), slug()+"-project.json", "application/json");
});
$("#openProj").addEventListener("click",function(){ $("#fileIn").click(); });
$("#fileIn").addEventListener("change",function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ adopt(JSON.parse(r.result)); }catch(e){ alert("That file is not a project this tool wrote."); return; }
    at=0; save(); syncChrome(); renderList(); renderPane(); validate();
  };
  r.readAsText(f);
  this.value="";
});

/* ============================================================
   Wiring
   ============================================================ */
$("#qlist").addEventListener("click",function(e){
  var b=e.target.closest(".qitem"); if(!b) return;
  at=+b.dataset.i; renderList(); renderPane();
});
$("#addQ").addEventListener("click",function(){
  proj.questions.push(blankQ());
  at=proj.questions.length-1;
  touch(true); renderPane();
});
$("#total").addEventListener("change",function(){
  var want=Math.max(1,Math.min(40, Math.round(Number(this.value)||1)));
  var qs=proj.questions;
  if(want>qs.length){ while(qs.length<want) qs.push(blankQ()); }
  else if(want<qs.length){
    /* Only ask when something would actually be lost. */
    var losing=qs.slice(want).some(function(q){
      return q.q.trim()||q.fb.trim()||q.a.some(function(a){return a.t.trim()});
    });
    if(losing && !confirm("Remove "+(qs.length-want)+" question"+(qs.length-want>1?"s":"")+
                          " from the end? They have writing in them.")){
      this.value=qs.length; return;
    }
    qs.length=want;
  }
  at=Math.min(at,qs.length-1);
  touch(true); renderPane();
});
$("#name").addEventListener("input",function(){ proj.name=this.value; touch(false); });
$("#pass").addEventListener("input",function(){
  proj.pass=Math.max(0,Math.min(100,Number(this.value)||0)); touch(false);
});
/* The theme changes what is exported and nothing else. The questions, the answers,
   the feedback and the pass mark are the same work whichever staging ships them —
   which is why it is a selector up here and not a mode the editor runs in. */
$("#theme").addEventListener("change",function(){
  proj.theme=this.value; touch(false);
  if(!$("#prevwrap").hidden) openPreview();     // keep an open preview honest
});
/* The KIND does change the editor, which is the whole difference between it and
   the theme: what a Copperfield is has no mark, no deck and no right answer, so
   the controls for those go rather than sit there doing nothing. */
$("#kind").addEventListener("change",function(){
  proj.kind=this.value;
  fit();
  syncChrome();
  touch(true); renderPane();
  if(!$("#prevwrap").hidden) openPreview();
});

/* Put the toolbar and the sidebar in the shape this kind needs, and fill the
   theme selector with the stagings that kind actually has. */
function syncChrome(){
  var r=rules(), ts=themesFor(proj.kind);
  $("#kind").value=proj.kind;
  $("#name").value=proj.name;
  $("#pass").value=proj.pass;
  $("#theme").innerHTML=ts.map(function(p){
    return '<option value="'+p.theme+'">'+esc(p.label)+'</option>';
  }).join("");
  $("#theme").value=(page()||ts[0]).theme;
  proj.theme=$("#theme").value;
  $("#passField").hidden=!r.mark;
  /* One staging is not a choice — showing a selector with a single entry invites
     somebody to go looking for the others. */
  $("#themeField").hidden=ts.length<2;
  $("#side").hidden=!r.deck;
}

/* ============================================================
   Preview — the exported page, in a frame, over the editor
   ============================================================ */
function openPreview(){
  /* srcdoc rather than a blob URL: the frame gets an opaque origin, which is what
     the lesson launcher gives these pages in Rise too, so the preview meets the
     same storage and messaging limits the real thing does. */
  $("#prevframe").srcdoc=pageHTML();
  /* Named by what is being previewed. Where a kind has one staging, its name is
     the whole of it — "Copperfield — Standard" says nothing the first word did not. */
  var kindName=($("#kind").selectedOptions[0]||{}).textContent||"Preview";
  var p=page();
  $("#prevname").textContent=
    themesFor(proj.kind).length>1 ? kindName+" — "+p.label : kindName;
  $("#prevwrap").hidden=false;
}
function closePreview(){
  $("#prevwrap").hidden=true;
  $("#prevframe").srcdoc="";     // stop it running behind the editor
  $("#preview").focus();
}
$("#preview").addEventListener("click",function(){ if(validate()) openPreview(); });
$("#prevClose").addEventListener("click",closePreview);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && !$("#prevwrap").hidden) closePreview();
});

load();
syncChrome();
renderList(); renderPane(); validate();
</script>
</body>
</html>
