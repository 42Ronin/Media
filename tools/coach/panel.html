<aside class="coach" id="coachWin" aria-label="Training panel">
  <div class="cwbar" id="cwBar">
    <span class="lz" id="secTitle"></span>
    <!-- A reminder, not a button. It used to replay the whole orientation, which is
         a lot to sit through when all you wanted was to remember what the two icons
         beside it do. Hovering or focusing says that, and nothing else happens. -->
    <span class="cwbtn cwhelp" id="cwHelp" tabindex="0" role="note" aria-describedby="cwTip">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 015 .9c0 1.7-2.5 2.1-2.5 3.6M12 17.2h.01"/></svg>
      <span class="cwtip" id="cwTip" role="tooltip">
        This panel is mine, not Clarity's. Drag it by the title bar to move it anywhere.
        <b>Pop out</b> lifts it off the edge; <b>collapse</b> rolls it up to the title bar.
        Neither moves the interface, and neither loses your place.
      </span>
    </span>
    <button class="cwbtn" id="cwPop" title="Pop out" aria-pressed="false" aria-label="Pop the training panel out of its column">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 014 19V8a1.5 1.5 0 011.5-1.5H10"/></svg></button>
    <button class="cwbtn" id="cwMin" title="Collapse" aria-label="Collapse training panel" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13h14"/></svg></button>
  </div>
  <!--__PANEL_BODY__-->
</aside>
