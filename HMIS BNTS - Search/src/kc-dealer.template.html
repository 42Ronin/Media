<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Check &mdash; the table</title>
<!--
  A third staging of the knowledge check: the DEALER'S TABLE.

  She is at the table the whole time. That is the difference between this and the
  other two — in the standard page and in the fortune teller she arrives with the
  answer, and her arrival IS the answer landing. A dealer does not turn up when
  the hand is over; she deals it. So she stands at the rail from the first card,
  and what changes is her face and what she says, not whether she is there.

  One bubble. It holds the question, then it holds the reading — the same box, so
  nothing on the table moves when it changes. The cards are never covered by
  anything, which is the whole reason this staging can be tighter than the ball:
  there is nothing hanging over the spread to clear.

  The felt is a bounded table on a transparent page, because the page around it
  belongs to Rise. Nothing here paints the body.

  Everything is drawn. The page fetches nothing. The one image is the LAHSA logo
  on the card backs, used whole and never redrawn.

  Questions come from script/kc_data.py via src/kc.json — the same list the shipped
  page, the teller and the docx use. Nothing narrates or coaches: no unscripted
  microcopy.

  The three rules every staging keeps:
    - a card cannot be taken while it is face down
    - no score ever leaves the page
    - completion is withheld until the pass mark is cleared
-->
<style>
:root{
  --felt:#166b4b; --felt-dk:#0c4630; --felt-ink:#e8f7ee;
  --rail:#7d5a2c; --rail-lt:#a8813f;
  --gold:#c9a44b; --gold-lt:#ecd489; --gold-dk:#8a6d22;
  --card:#f7f0df; --card-ink:#2b2320;
  --say:#f6f1e4; --say-ink:#241d17;
  --ink:#1e2f3a; --mut:#5f7787;
  --focus:#7fd8ff;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
/* transparent — Rise owns the page */
body{font:15.5px/1.62 Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  color:var(--ink);background:var(--stage-bg,transparent);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.sans{font-family:"Segoe UI",system-ui,-apple-system,sans-serif}

.frame{max-width:940px;margin:0 auto;padding:10px 16px 22px}

/* ============================================================
   The table

   A rail across the top with the dealer behind it, felt below. The curve is the
   whole reason it reads as a table rather than a green box: the top edge is the
   arc a dealer stands inside.
   ============================================================ */
.table{position:relative;border-radius:26px 26px 34px 34px;padding:0 0 22px;
  background:
    radial-gradient(120% 78% at 50% 4%, #1d7d59 0%, var(--felt) 44%, var(--felt-dk) 100%);
  box-shadow:0 26px 54px rgba(10,40,28,.28), 0 2px 0 rgba(255,255,255,.12) inset,
    0 0 0 1px rgba(9,52,36,.5);
  overflow:hidden}
/* the rail: brass over wood, curved to hold the dealer's station */
.rail{position:relative;height:96px;
  background:linear-gradient(180deg,var(--rail-lt),var(--rail) 58%,#5d4220);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.28)}
.rail::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-38px;height:76px;
  border-radius:50%;background:radial-gradient(60% 100% at 50% 0,#1d7d59,var(--felt) 70%);
  box-shadow:0 -3px 0 rgba(255,255,255,.14) inset}
/* the felt's own arc, drawn once under the rail so the seam is a curve not a line */
.arc{position:absolute;left:6%;right:6%;top:74px;height:120px;border-radius:50%;
  border-top:2px solid rgba(236,212,137,.28);pointer-events:none}

/* ============================================================
   The dealer's station: her, and the one bubble she speaks in
   ============================================================ */
.station{position:relative;z-index:3;display:flex;align-items:flex-start;gap:20px;
  max-width:820px;margin:-70px auto 0;padding:0 22px}
/* She stands at the rail — half over it, which is what puts her BEHIND the table
   rather than on it. */
.lashy{flex:none;width:118px;height:118px;position:relative;
  filter:drop-shadow(0 10px 18px rgba(8,36,24,.45))}
.lashy svg{width:100%;height:100%;display:block;overflow:visible}
.lashy .mface{display:block;width:100%;height:100%;transform-origin:44% 42%}
.lashy .puff{position:absolute;left:4%;top:2%;width:90%;height:90%;border-radius:50%;
  border:2.5px solid rgba(255,236,190,.75);opacity:0;pointer-events:none}
.lashy.in .mface{animation:poofIn .5s cubic-bezier(.3,1.45,.5,1)}
.lashy.in .puff{animation:puffRing .5s ease-out}
@keyframes poofIn{0%{transform:scale(.7) rotate(-12deg);opacity:0}
  60%{transform:scale(1.06) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes puffRing{0%{transform:scale(.4);opacity:.6}100%{transform:scale(1.5);opacity:0}}

/* One bubble, two things in it. They are stacked in a single grid cell and
   cross-faded rather than swapped: the bubble is then as tall as the TALLER of
   the two, so the table cannot move when the hand turns over. Positioning the
   feedback absolutely instead left the bubble at the question's height and put
   the Next button out on the felt. Between hands the height may change — that
   happens while the cards are flying in from the rail, so there is nothing
   settled on the table for it to move. */
.bubble{position:relative;flex:1;min-width:0;margin-top:26px;display:grid;
  background:var(--say);color:var(--say-ink);border-radius:16px;padding:15px 20px;
  box-shadow:0 14px 28px rgba(8,36,24,.3), inset 0 0 0 1px rgba(120,92,40,.22)}
/* the tail, pointing back at the dealer */
.bubble::before{content:"";position:absolute;left:-11px;top:24px;width:0;height:0;
  border:11px solid transparent;border-right-color:var(--say);border-left:0}
/* `visibility` as well as opacity: the hidden layer has to keep its box — that is
   what makes the bubble the taller of the two — but a transparent element is still
   in the accessibility tree, and the reading must not be readable before the card
   is taken. Visibility is switched at the END of the fade out and the START of the
   fade in, so neither transition snaps. */
.layer{grid-area:1/1;transition:opacity .28s}
.layer.gone{opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .28s, visibility 0s linear .28s}
.qn{margin:0 0 5px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#8a6a3a;font-weight:700}
.qt{font-size:17.5px;line-height:1.45;font-weight:600}
.verdict{font-size:18px;font-weight:700;margin-bottom:5px}
.verdict.good{color:#186c4a}
.verdict.bad{color:#a5352c}
.fb{font-size:14.5px;line-height:1.5}
/* A question can ship with no feedback at all — the maker lets each one be
   switched off. An empty box still costs the flex gap above the button, so it
   goes entirely rather than leaving a hole where a paragraph was. */
.fb:empty{display:none}
.foot{margin-top:12px;display:flex;flex-wrap:wrap;gap:9px}
.tablebtns{display:contents}
.tablebtns:empty{display:none}
.go{font-family:"Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#2b2010;
  border-radius:10px;padding:9px 20px;font-size:14.5px;font-weight:700;transition:filter .15s;
  box-shadow:0 2px 0 var(--gold-dk)}
.go:hover{filter:brightness(1.08)}
.go.quiet{background:none;color:#6b5410;box-shadow:inset 0 0 0 1px rgba(140,110,30,.55)}
.go.quiet:hover{background:rgba(201,164,75,.16)}

/* ============================================================
   The spread — cards laid on the felt
   ============================================================ */
.spread{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;
  margin:26px auto 0;perspective:1400px;min-height:238px}
.tcard{position:relative;width:178px;height:232px;margin:0 11px;padding:0;background:none;
  transform-style:preserve-3d;cursor:default;
  transform:rotate(var(--tilt)) translateY(var(--lift,0));
  transition:transform .42s cubic-bezier(.22,1.1,.36,1)}
.spread.live .tcard{cursor:pointer}
.spread.live .tcard:hover{transform:rotate(var(--tilt)) translateY(calc(var(--lift,0px) - 16px))}
.tface{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;overflow:hidden;transition:opacity .35s;
  box-shadow:0 16px 26px rgba(6,34,22,.42), 0 2px 5px rgba(6,34,22,.3)}
.tback{background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 9px,transparent 9px 18px),
  radial-gradient(120% 90% at 30% 8%, #0b5f80, #05435c 58%, #032b3c 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 16px 26px rgba(6,34,22,.45), inset 0 0 0 2px var(--gold-dk),
    inset 0 0 0 3.5px rgba(236,212,137,.32)}
/* the logo, whole. The gold bar is 33.4% of the lockup, so clear space is that
   again on every side: at 52% of a 232px card that is 40px against 56px of margin. */
.tback img{height:52%;width:auto;display:block}
.tback .crest{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center}
.tback .crest::after{content:"";display:block;width:18px;height:18px;border-radius:3px;
  background:var(--gold);transform:rotate(45deg)}
.tfront{background:linear-gradient(180deg,#fffcf4,var(--card));color:var(--card-ink);
  transform:rotateY(180deg);display:flex;flex-direction:column;padding:16px 15px 14px;
  box-shadow:0 16px 26px rgba(6,34,22,.42), inset 0 0 0 1.5px rgba(201,164,75,.55)}
.tfront .idx{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#9b7d33}
/* Centred in the card. Nothing hangs over the spread in this staging, so unlike
   the ball there is no clearance to buy and no reason to push it off centre. */
.tfront .txt{flex:1;display:flex;align-items:center;font-size:14.5px;line-height:1.44;
  padding:8px 0}
.tfront .mark{height:18px;white-space:nowrap;font-size:11.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:transparent}

.tcard.up{transform:rotate(var(--tilt)) translateY(var(--lift,0)) rotateY(180deg)}
.spread.live .tcard.up:hover{
  transform:rotate(var(--tilt)) translateY(calc(var(--lift,0px) - 16px)) rotateY(180deg)}
/* dealt from her hand: in from the rail, not from nowhere */
.tcard.dealt{animation:dealIn .52s cubic-bezier(.25,1.05,.35,1) backwards}
@keyframes dealIn{
  from{transform:translate(0,-210px) rotate(-9deg) scale(.72);opacity:0}
  to{transform:rotate(var(--tilt)) translateY(var(--lift,0));opacity:1}}

/* The taken card comes forward to the dealer. 12px and 1.04 — a bigger rise put
   the card's own first line under things in the other staging, and there is no
   reason to relearn that here. */
.tcard.taken{z-index:2;transform:rotate(0deg) translateY(-12px) rotateY(180deg) scale(1.04)}
.spread.done .tcard.taken:hover{transform:rotate(0deg) translateY(-12px) rotateY(180deg) scale(1.04)}
.tcard.taken .tfront{box-shadow:0 26px 40px rgba(6,34,22,.5), inset 0 0 0 2px currentColor}
.tcard.right .tfront{color:#1c7a55;background:#eef7ef}
.tcard.right .mark{color:#1c7a55}
.tcard.wrong .tfront{color:#a5352c;background:#faece9}
.tcard.wrong .mark{color:#a5352c}
/* NOT dimmed: this is the card they should have taken, and dimming it made the
   answer the least legible thing on the table. */
.tcard.answer{transform:rotate(var(--tilt)) translateY(calc(var(--lift,0px) - 6px)) rotateY(180deg)}
.tcard.answer .tfront{background:#f2faf3;
  box-shadow:0 20px 30px rgba(28,122,85,.34), inset 0 0 0 2px #1c7a55}
.tcard.answer .mark{color:#1c7a55}
/* Dim the FACES, never the card: opacity below 1 flattens a preserve-3d element,
   which turns backface culling off and shows the back of a card that is face up. */
.tcard.spent .tface{opacity:.44;filter:saturate(.7)}
.tcard.spent{transform:rotate(var(--tilt)) translateY(calc(var(--lift,0px) + 14px)) rotateY(180deg) scale(.93)}
.spread.done .tcard,.spread.done .tcard:hover{cursor:default}

/* ============================================================
   The chip tray — the tally, in the currency of the table
   ============================================================ */
.footrow{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
  gap:14px;margin:28px auto 0}
.stones{display:flex;gap:7px}
.stone{width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #f2f6f8, #c9d6dd 68%, #93a6b0);
  box-shadow:0 2px 4px rgba(4,26,17,.4), inset 0 0 0 2px rgba(255,255,255,.55);
  transition:background .4s,box-shadow .4s}
/* the notches a chip's edge has, drawn rather than described */
.stone::after{content:"";position:absolute;inset:0}
.stone.lit{background:radial-gradient(circle at 36% 30%, #ffeaa6, var(--gold) 60%, #8a6d22);
  box-shadow:0 3px 7px rgba(4,26,17,.45), inset 0 0 0 2px rgba(255,244,206,.75)}
.stone.out{background:radial-gradient(circle at 36% 30%, #e0aaa5, #a5352c 68%, #7a241d);
  box-shadow:0 2px 4px rgba(4,26,17,.4), inset 0 0 0 2px rgba(255,220,215,.5)}
.count{margin:0;font-size:12.5px;color:var(--felt-ink);opacity:.85}
.count b{opacity:1;font-weight:700}

/* ---------- her drawing: the lesson's, with the costume the teller gave her ---------- */
.m-rim{fill:none;stroke:#066888;stroke-width:6}
.m-glass{fill:#f2fbff}
.m-eye{fill:#14222b}
.m-lidfill{fill:#f2fbff}
.m-lidline{fill:none;stroke:#14222b;stroke-width:2.4;stroke-linecap:round}
.m-spark{fill:#14222b}
.m-arc{fill:none;stroke:#14222b;stroke-width:3;stroke-linecap:round}
.m-lash path{fill:none;stroke:#14222b;stroke-width:2.2;stroke-linecap:round}
.m-mouth{fill:none;stroke:#14222b;stroke-width:3;stroke-linecap:round}
.m-shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.85}
/* A dealer's visor, not the teller's headscarf — same envelope, because the rule
   that put the scarf there holds for anything she wears: on the rim, never over
   the glass, and above every lash at every x. She is called Lashes. */
.m-visor{fill:#1f8a5f}
.m-visor-lip{fill:none;stroke:#0d5637;stroke-width:1.6;stroke-linecap:round}
.m-band{fill:none;stroke:#c9a44b;stroke-width:3;stroke-linecap:round}
.m-hoop{fill:none;stroke:#c9a44b;stroke-width:2.4}
.m-body{animation:mbob 3.6s ease-in-out infinite;transform-origin:44px 42px}
@keyframes mbob{0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-5px) rotate(-5deg)}75%{transform:translateY(-2px) rotate(4deg)}}
.m-eyes{animation:mblink 5.4s infinite;transform-origin:44px 39px}
@keyframes mblink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.m-face{animation:mscan 6.5s ease-in-out infinite}
@keyframes mscan{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}

@media(max-width:700px){
  .station{gap:14px;padding:0 14px}
  .lashy{width:92px;height:92px}
  .tcard{width:152px;height:212px;margin:0 6px}
}
@media(prefers-reduced-motion:reduce){
  .m-body,.m-face,.m-eyes,.lashy.in .mface,.lashy.in .puff{animation:none !important}
  .tcard,.tcard.dealt{animation:none;transition:none}
  .spread.live .tcard:hover{transform:rotate(var(--tilt)) translateY(var(--lift,0))}
}
</style>
</head>
<body>

<div class="frame">
  <div class="table">
    <div class="rail" aria-hidden="true"></div>
    <div class="arc" aria-hidden="true"></div>

    <!-- The dealer, at the rail the whole time, and the one bubble she speaks in.
         The question and the reading are stacked in it and cross-faded, so the
         table never moves when the hand turns over. -->
    <div class="station">
      <div class="lashy" id="lashy" aria-hidden="true"></div>
      <div class="bubble" id="bubble">
        <div class="layer" id="ask">
          <p class="qn sans" id="qn"></p>
          <div class="qt" id="qt"></div>
        </div>
        <div class="layer gone" id="said">
          <div class="verdict" id="verdict" hidden></div>
          <div class="fb" id="fb"></div>
          <!-- Next is a permanent child. The table screen writes its own two
               buttons into #tablebtns beside it rather than over it, because
               innerHTML on the foot deleted this button and the next reading
               then threw on setting its label. -->
          <div class="foot" id="foot">
            <button class="go" id="next"></button>
            <span class="tablebtns" id="tablebtns"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="spread" id="spread" role="group" aria-labelledby="qt"></div>

    <div class="footrow">
      <div class="stones" id="stones" aria-hidden="true"></div>
      <p class="count sans" id="count"></p>
    </div>
  </div>
</div>

<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<script>
var KC = /*__KC__*/;
var LOGO = /*__LOGO__*/;
var $=function(s){return document.querySelector(s)};
var LETTER=["A","B","C","D","E"];
var TILT=["-4deg","0.5deg","4deg"], LIFT=["10px","0px","9px"];

/* --- her face: the lesson's drawing, plus the costume that lives in the themes --- */
var LASH={
  open:'<g class="m-lash"><path d="M30.5 34.5 l-3 -2.5"/><path d="M34.5 33.2 l-1 -3"/><path d="M38.5 34 l1.5 -2.8"/>'+
       '<path d="M48.5 34 l-1.5 -2.8"/><path d="M52.5 33.2 l1 -3"/><path d="M56.5 34.5 l3 -2.5"/></g>',
  high:'<g class="m-lash"><path d="M30 33.5 l-3.4 -3"/><path d="M34.3 32 l-1.2 -3.4"/><path d="M38.4 32.8 l1.7 -3.2"/>'+
       '<path d="M48.6 32.8 l-1.7 -3.2"/><path d="M52.7 32 l1.2 -3.4"/><path d="M57 33.5 l3.4 -3"/></g>',
  low: '<g class="m-lash"><path d="M30.8 38 l-3 -1"/><path d="M34.9 36.8 l-.7 -2.2"/><path d="M38.9 37.6 l1.4 -1.9"/>'+
       '<path d="M49.1 37.6 l-1.4 -1.9"/><path d="M53.1 36.8 l.7 -2.2"/><path d="M57.2 38 l3 -1"/></g>'
};
function spark(cx,cy){
  return '<path class="m-spark" d="M'+cx+' '+(cy-4.6)+' q1 3.4 4.6 4.6 q-3.6 1.2 -4.6 4.6 '+
         'q-1 -3.4 -4.6 -4.6 q3.6 -1.2 4.6 -4.6 z"/>';
}
function droll(cx){
  return '<circle class="m-eye" cx="'+cx+'" cy="39.5" r="4"/>'+
         '<rect class="m-lidfill" x="'+(cx-4.6)+'" y="34" width="9.2" height="3.9" rx="1.6"/>'+
         '<path class="m-lidline" d="M'+(cx-4)+' 37.7 h8"/>';
}
var EYES={
  open:   {e:'<circle class="m-eye" cx="35" cy="39" r="4"/><circle class="m-eye" cx="53" cy="39" r="4"/>', l:"open"},
  droll:  {e:droll(35)+droll(53), l:"low"},
  sparkle:{e:spark(35,39)+spark(53,39), l:"high"},
  arcs:   {e:'<path class="m-arc" d="M30.5 41 q4.5 -6 9 0"/><path class="m-arc" d="M48.5 41 q4.5 -6 9 0"/>', l:"open"}
};
var MOUTH={tip:"M36 51 q8 7 16 0", plain:"M37 51 q7 4.5 14 0", cheer:"M33 49 q11 10 22 0",
           wry:"M41.5 51.2 q4.2 2.8 8.4 .7", hm:"M40 51.8 q4 1.4 8 0"};

var COSTUME=
  '<path class="m-visor" d="M17.4 26 A31 31 0 0 1 70.5 26 Q44 31 17.4 26 Z"/>'+
  '<path class="m-visor-lip" d="M18.6 26.6 Q44 31.4 69.3 26.6"/>'+
  '<path class="m-band" d="M18.4 24.2 Q44 28.6 69.6 24.2"/>'+
  '<circle class="m-hoop" cx="68" cy="63" r="6"/>';

function svg(eyes,mouth){
  var ex=EYES[eyes]||EYES.open, m=MOUTH[mouth]||MOUTH.tip;
  /* Cropped to the drawing: her ink measures 71.5 x 61 in the 100-square box she
     was authored in, so a 100-square viewBox spends a third of her on nothing. */
  return '<svg viewBox="0.25 3.5 76 76" aria-hidden="true">'+
    '<g class="m-body">'+
      '<circle class="m-rim" cx="44" cy="42" r="30"/>'+
      '<circle class="m-glass" cx="44" cy="42" r="25"/>'+
      '<g class="m-face"><g class="m-eyes">'+ex.e+'</g>'+LASH[ex.l]+
        '<path class="m-mouth" d="'+m+'"/></g>'+
      '<path class="m-shine" d="M27 30 q7-9 17-10"/>'+
      COSTUME+
    '</g></svg>';
}
/* She is at the table throughout — this only changes her face. The other two
   stagings use it to make her appear; here appearing is not the event. */
function face(eyes,mouth){
  var el=$("#lashy");
  el.innerHTML='<span class="puff"></span><span class="mface">'+svg(eyes,mouth)+'</span>';
  el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
}

/* The bubble holds one of two things. They are stacked, so the swap costs the
   table no height and nothing under it moves. */
function sayIn(kind){
  $("#verdict").className="verdict "+kind;
  $("#ask").classList.add("gone");
  $("#said").classList.remove("gone");
}
function sayOut(then){
  $("#said").classList.add("gone");
  $("#ask").classList.remove("gone");
  later(function(){ if(then) then(); }, reduced?0:280);
}

/* --- the only two things it ever says to a host --- */
var EMBED=(function(){
  var framed=false, sent=false;
  try{ framed=(window.parent && window.parent!==window); }catch(e){ framed=true; }
  function send(type,data){
    if(!framed) return;
    var msg={source:"hmis-sim",lesson:"hmis-bnts-search",section:"kc",type:type};
    for(var k in data) if(Object.prototype.hasOwnProperty.call(data,k)) msg[k]=data[k];
    try{ window.parent.postMessage(msg,"*"); }catch(e){}
  }
  return {ready:function(n){ send("ready",{questions:n}); },
          complete:function(){ if(sent) return; sent=true; send("complete",{}); }};
})();

var QS=KC.questions||[], PASS=KC.pass||0.8;
var NEED=Math.ceil(PASS*QS.length);
var got=[], order=[], at=0;
var reduced=!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches);
var timers=[];
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
function clearLater(){ timers.forEach(clearTimeout); timers=[]; }
function shuffle(a){ a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  return a; }
function correctCount(){ var n=0; for(var i=0;i<got.length;i++) if(got[i]===true) n++; return n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function list(a){ return a.length<2 ? a.join("") : a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }

function paintStones(){
  $("#stones").innerHTML=got.map(function(v){
    return '<span class="stone'+(v===true?" lit":v===false?" out":"")+'"></span>';
  }).join("");
  $("#count").innerHTML="<b>"+correctCount()+"</b> of "+QS.length;
}

function deal(){
  clearLater();
  var qi=order[at], q=QS[qi], deck=shuffle(q.a);

  $("#qt").textContent=q.q;
  $("#qn").textContent="Question "+(qi+1)+" of "+QS.length;
  /* The reading is written NOW, while it is still hidden, so the bubble is already
     as tall as it will need to be. Written at the moment of the pick instead, the
     bubble grew by whatever the feedback needed and walked the whole spread down
     the felt. */
  $("#verdict").hidden=true; $("#verdict").textContent="";
  $("#fb").textContent=q.fb;
  $("#tablebtns").innerHTML=""; $("#next").hidden=false;
  $("#next").textContent=(at>=order.length-1)?"See the table":"Next card";
  face("open","plain");
  paintStones();

  var sp=$("#spread");
  sp.className="spread";
  sp.innerHTML=deck.map(function(a,i){
    return '<button class="tcard'+(reduced?" up":"")+'" type="button" data-ok="'+(a.ok?"1":"0")+'"'+
      ' style="--tilt:'+TILT[i]+';--lift:'+LIFT[i]+'" aria-disabled="true" tabindex="-1">'+
      '<span class="tface tback" aria-hidden="true">'+
        (LOGO?'<img src="'+LOGO+'" alt="">':'<span class="crest"></span>')+'</span>'+
      '<span class="tface tfront">'+
        '<span class="idx sans" aria-hidden="true">'+LETTER[i]+'</span>'+
        '<span class="txt">'+esc(a.t)+'</span>'+
        '<span class="mark sans" aria-hidden="true"></span>'+
      '</span></button>';
  }).join("");

  var cards=[].slice.call(sp.querySelectorAll(".tcard"));
  cards.forEach(function(c,i){
    c.addEventListener("click",function(){ take(c,cards,q); });
    if(reduced) return;
    c.classList.add("dealt");
    c.style.animationDelay=(i*150)+"ms";
    later(function(){ c.classList.add("up"); }, 620+i*170);
  });
  /* Face down means face down. Same rule as every other staging: a blank card you
     can take is a guess, and guessing is the habit this lesson exists to break. */
  later(function(){
    sp.classList.add("live");
    cards.forEach(function(c){ c.setAttribute("aria-disabled","false"); c.tabIndex=0; });
    $("#live").textContent="Question "+(qi+1)+" of "+QS.length+". "+q.q;
  }, reduced?0:620+cards.length*170+140);
}

function take(card,cards,q){
  var sp=$("#spread");
  if(!sp.classList.contains("live")) return;
  sp.classList.remove("live"); sp.classList.add("done");
  clearLater();

  var right=card.dataset.ok==="1";
  got[order[at]]=right;

  cards.forEach(function(c){
    c.setAttribute("aria-disabled","true"); c.tabIndex=-1;
    c.classList.add("up");
    var mark=c.querySelector(".tfront .mark");
    if(c===card){
      c.classList.add("taken", right?"right":"wrong");
      mark.textContent=right?"Your card ✓":"Your card";
    }else if(c.dataset.ok==="1"){
      c.classList.add("answer");
      mark.textContent="Take this one";
    }else{
      c.classList.add("spent");
    }
  });

  paintStones();
  $("#live").textContent=(right?"Correct. ":"Not correct. ")+q.fb;

  later(function(){
    /* Nothing to write: the reading has been in the bubble since the deal, unseen.
       No line announcing the result either — the cards on the felt are already
       marked right and wrong, in colour, on the one the learner actually picked.
       The table screen keeps its line, because the gate has to state itself. */
    face(right?"sparkle":"droll", right?"cheer":"wry");
    sayIn(right?"good":"bad");
    later(function(){ $("#next").focus(); },60);
  }, reduced?0:300);
}

$("#next").addEventListener("click",function(){
  at++;
  sayOut(function(){ if(at<order.length) deal(); else finish(); });
});

function finish(){
  clearLater();
  var score=correctCount(), passed=score>=NEED, missed=[];
  for(var i=0;i<got.length;i++) if(got[i]===false) missed.push(i+1);

  $("#spread").innerHTML=""; $("#spread").className="spread";
  paintStones();
  $("#qn").textContent=""; $("#qt").textContent="";
  $("#verdict").hidden=false;
  $("#verdict").textContent=passed?"You are through."
    :"Not quite — "+NEED+" of "+QS.length+" needed.";
  $("#fb").textContent=passed
    ? "None of this is about remembering a rule. It is about not deciding on one signal — which is the difference between finding somebody's record and starting them a second one."
    : "Question"+(missed.length===1?" ":"s ")+list(missed)+" went the other way. I will lay "+
      (missed.length===1?"it":"them")+" again, in a different order.";
  face(passed?"sparkle":"droll", passed?"cheer":"hm");
  sayIn(passed?"good":"bad");
  $("#live").textContent=(passed?"Passed. ":"Not passed. ")+score+" of "+QS.length+" right.";

  if(passed){
    $("#foot").hidden=true;
    EMBED.complete();
  }else{
    $("#foot").hidden=false;
    $("#next").hidden=true;
    $("#tablebtns").innerHTML='<button class="go quiet" id="againAll" type="button">Start over</button>'+
      '<button class="go" id="againBad" type="button">Lay '+(missed.length===1?"it":"those "+missed.length)+' again</button>';
    $("#againBad").addEventListener("click",function(){ replay(missed.map(function(n){return n-1})); });
    $("#againAll").addEventListener("click",function(){ replay(null); });
    later(function(){ $("#againBad").focus(); },60);
  }
}

function replay(which){
  if(which===null){ got=QS.map(function(){return null}); order=QS.map(function(_,i){return i}); }
  else order=which.slice();
  at=0;
  $("#foot").hidden=false;
  sayOut(deal);
}

(function(){
  /* The name the maker was given titles the page. There is no heading to put it
     in — this staging has no chrome of its own on purpose. */
  if(KC.title) document.title=KC.title;
  if(!QS.length){ $("#qt").textContent="No questions were built into this page."; return; }
  got=QS.map(function(){return null});
  order=QS.map(function(_,i){return i});
  EMBED.ready(QS.length);
  deal();
})();
</script>
</body>
</html>
