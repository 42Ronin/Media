<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copperfield</title>
<!--
  The Copperfield: an interactive box that happens to look like a multiple
  choice question, and is not one.

  There is no right answer and nothing is scored. Every answer is something
  worth reading; resting on one takes it, and when the last one has gone the
  question goes with it and the box underneath is the point of the whole thing.
  It exists to keep the content fresh as a learner works through it, not to
  test them.

  ONE question. This is a single interactive block, not a deck — a series is
  several of these, each embedded on its own slide. So there are no pips, no
  tally, no pass mark, and the completion it reports is exhaustion: the learner
  has cleared every answer. Still no score, as everywhere else in these lessons.

  A taken card DISINTEGRATES: a soft diagonal edge sweeps across it and the
  motes carry off the way the edge travels, so it comes apart from one corner
  rather than shrinking away whole. It is taken by HOVER, on a dwell — a mouse
  crossing the row would otherwise clear every answer in one pass and the
  learner would read none of them. Click and the keyboard still work, because a
  pointer is not something every learner has.

  The token below is written out exactly once, beside `var KC`. Do not name it
  in prose: build.sh replaces every occurrence and the maker replaces the first,
  so a second mention silently swallows the content in one of them.
-->
<style>
:root{
  --teal:#066888; --teal-dk:#044e66; --teal-lt:#3fa0c0; --lens:#e0eff5;
  --ink:#14222b; --mut:#5f7f8f; --line:#d9e8ef;
  /* The container is transparent and the bluish is on what sits on it, so this
     reads as part of the Rise page rather than a panel bolted onto it. */
  --panel:#e9f3f8; --panel-2:#f2f8fb;
  --focus:#0b6fd4;
}
*{box-sizing:border-box}
/* any display: value beats the [hidden] default — one rule, as in the lesson */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  font:15px/1.6 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:transparent; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.wrap{max-width:880px;margin:0 auto;padding:14px 16px 22px}
.head{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--teal);letter-spacing:.01em}

/* ============================================================
   The stage

   Both states live in ONE grid cell: the question with its answers, and the
   box that replaces them. The cell is as tall as the taller of the two, so
   swapping which one is visible moves nothing — this block is embedded in a
   Rise page and anything that changes height shunts everything below it.

   The hidden state uses visibility as well as opacity. It has to keep its box,
   but a merely transparent element is still in the accessibility tree, and the
   reveal must not be readable before the last answer has gone.
   ============================================================ */
.stage{display:grid}
.stage > *{grid-area:1/1}
.state{transition:opacity .42s ease}
.state[data-on="0"]{opacity:0;visibility:hidden;pointer-events:none}
/* The cell is as tall as the question and its answers, which is the taller of
   the two. The box that replaces them is centred in that room rather than hung
   from the top of it, so the space it does not need reads as margin instead of
   as a hole under the box. */
#reveal{display:flex;flex-direction:column;justify-content:center}

/* ---------- the question ---------- */
.ask{background:var(--panel);border-left:4px solid var(--teal);border-radius:12px;
  padding:15px 18px;font-size:16.5px;line-height:1.55;margin:0 0 18px}

/* ---------- the answers ---------- */
.hand{display:flex;gap:14px;align-items:stretch;justify-content:center;flex-wrap:wrap}
/* The slot keeps its box for good. A card that vanished used to take its space
   with it, and the answers still on the table slid under the cursor — the next
   click landing on something that had moved. */
.slot{flex:1 1 0;min-width:190px;max-width:280px;position:relative}
.card{width:100%;height:100%;min-height:118px;display:flex;align-items:center;
  text-align:left;padding:16px 18px;border-radius:14px;
  background:var(--panel-2);border:1.5px solid var(--line);
  box-shadow:0 2px 8px rgba(20,34,43,.06);
  font-size:15.5px;line-height:1.5}

/* ---------- resting on one takes it ----------
   The card is taken by DWELLING on it, not by clicking. A mouse crossing the row
   on its way somewhere else would otherwise clear every answer in one sweep and
   the learner would read none of them, so it has to be rested on: a pass does not
   linger, and the time it takes to linger is the time it takes to read.

   The dwell is not a WAIT. It begins to come apart the moment the pointer rests
   on it and finishes if the pointer stays — leave and it knits back together.
   Held as a pause with only a lift to show for it, the effect started late and
   the card seemed to sit there doing nothing before suddenly going.

   Click and the keyboard still take a card. Hover is the interaction; those are
   the floor, because a pointer is not something every learner has and a box that
   cannot be finished is worse than one finished the ordinary way. */

/* ---------- the dust ----------
   Not a puff — it disintegrates. The card is masked by a soft diagonal edge that
   sweeps across it, so it comes apart from one corner rather than shrinking away
   as a whole, and the motes carry off in the same direction the edge travels.

   The sweep is a custom property because a gradient's own stops cannot be
   animated, and it is driven by TRANSITIONS rather than keyframes: a transition
   runs from wherever the value currently is, which is what lets the fray reverse
   when the pointer leaves and lets the commit carry on from however far it got
   rather than snapping back to the start. Where @property is not understood the
   mask never moves and the card simply fades, which is where reduced motion
   lands too. */
@property --dust{syntax:"<percentage>";inherits:false;initial-value:-30%}
.slot .card{--dust:-30%;
  -webkit-mask-image:linear-gradient(100deg,transparent var(--dust),#000 calc(var(--dust) + 26%));
  mask-image:linear-gradient(100deg,transparent var(--dust),#000 calc(var(--dust) + 26%));
  transition:--dust .40s linear}
/* No lift and no highlight: the card coming apart under the pointer IS the cue,
   and a border colour arriving first only delays it. Straight to it. */
.slot.dwell .card{--dust:15%}
.slot.gone .card{--dust:118%;transform:translate(14px,-10px);opacity:.9;pointer-events:none;
  transition:--dust .52s cubic-bezier(.4,.05,.75,.6),transform .52s ease-in,opacity .52s ease-in}
/* The motes. One element each, laid over the card's own box and let go in a
   stagger that follows the sweep — the ones at the leading corner leave first,
   which is what makes it read as the card coming apart rather than as a cloud
   released all at once. */
.mote{position:absolute;border-radius:50%;pointer-events:none;opacity:0;
  background:var(--teal-dk);
  animation:mote var(--dur) cubic-bezier(.22,.6,.3,1) var(--delay) forwards}
@keyframes mote{
  0%{opacity:0;transform:translate(0,0) scale(1)}
  12%{opacity:var(--peak)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}
}
/* The same mote, run backwards: it arrives from where a leaving one would have
   gone and settles onto the spot it belongs to. The writing does not fade in, it
   comes together out of the dust the answers left. */
.mote.in{animation-name:moteIn;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
@keyframes moteIn{
  0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}
  22%{opacity:var(--peak)}
  100%{opacity:0;transform:translate(0,0) scale(1)}
}
@keyframes poofIn{0%{transform:scale(.12) rotate(-165deg);opacity:0}
  55%{transform:scale(1.16) rotate(14deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes puffRing{0%{transform:scale(.35);opacity:.6}100%{transform:scale(1.6);opacity:0}}

/* ---------- what was under them ----------
   No panel. The writing sits on whatever Rise puts behind the block, the way the
   question's answers sat on it — a tinted card here would make the reveal read as
   a thing that arrived rather than as what was under the answers all along. */
.reveal{display:flex;gap:16px;align-items:flex-start}
.reveal .say{flex:1;font-size:16px;line-height:1.62;margin:0;position:relative}
.reveal .say p{margin:0 0 10px}
.reveal .say p:last-child{margin-bottom:0}
/* ...and it assembles the way the cards came apart, by the same sweep run the
   other way: masked out to begin with, and the opaque side grows across it. */
@property --form{syntax:"<percentage>";inherits:false;initial-value:-30%}
.reveal .say{--form:-30%;
  -webkit-mask-image:linear-gradient(100deg,#000 var(--form),transparent calc(var(--form) + 26%));
  mask-image:linear-gradient(100deg,#000 var(--form),transparent calc(var(--form) + 26%))}
.state[data-on="1"] .say{--form:118%;transition:--form .9s cubic-bezier(.3,.7,.4,1) .12s}

/* She turns up with the box, the way she turns up for the feedback next door —
   her arrival is the reveal landing rather than a face that was sitting there. */
.lashy{flex:none;width:84px;height:84px;margin:-4px 0 0 -4px;position:relative}
/* Her drawing is not hit-testable, so `#lashy` itself is always the target. The
   hover reaction redraws her face, and redrawing the node the pointer is over
   destroys what the browser is tracking: it then re-enters from nothing, fires
   pointerenter again, redraws again — fourteen times in a fifth of a second —
   and pointerleave never resolves, so she stayed reacting after the pointer had
   gone. Nothing in here is interactive anyway; the svg is aria-hidden. */
.lashy svg,.lashy .mface{pointer-events:none}
.lashy svg{width:100%;height:100%;display:block;overflow:visible}
.lashy .mface{display:block;width:100%;height:100%;
  /* her face sits at (44,42) in a 100-box, so spin and shrink about that */
  transform-origin:44% 42%}
.lashy .puff{position:absolute;left:5%;top:3%;width:88%;height:88%;border-radius:50%;
  border:2.5px solid var(--teal);opacity:0;pointer-events:none}
.lashy.in .mface{animation:poofIn .46s cubic-bezier(.3,1.45,.5,1)}
.lashy.in .puff{animation:puffRing .44s ease-out}
/* She answers a hover. The `.in` class is taken off once her arrival has played,
   so this is the only animation on her by the time anyone can reach her — left on,
   the two rules sit at equal specificity and unhovering re-ran her entrance. */
.lashy.react .mface{animation:lznod .66s ease-in-out}
@keyframes lznod{
  0%{transform:none}
  22%{transform:translateY(-7px) rotate(-9deg)}
  52%{transform:translateY(0) rotate(7deg)}
  78%{transform:translateY(-3px) rotate(-3deg)}
  100%{transform:none}
}

.m-rim{fill:none;stroke:var(--teal);stroke-width:5}
.m-glass{fill:var(--lens)}
.m-eye{fill:var(--teal-dk)}
.m-lash{fill:none;stroke:var(--teal-dk);stroke-width:2.6;stroke-linecap:round}
.m-mouth{fill:none;stroke:var(--teal-dk);stroke-width:3.2;stroke-linecap:round}
.m-arc{fill:none;stroke:var(--teal-dk);stroke-width:3;stroke-linecap:round}
.m-spark{fill:var(--teal-dk)}
.m-lidfill{fill:var(--lens)}
.m-lidline{fill:none;stroke:var(--teal-dk);stroke-width:2.6;stroke-linecap:round}
.m-shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.85}

@media(prefers-reduced-motion:reduce){
  .card,.state{transition:none}
  .slot.gone .card,.mote,.lashy.in .mface,.lashy.in .puff,.lashy.react .mface{animation:none}
  .mote{display:none}
  /* No sweep either — the writing is simply there. */
  .state[data-on="1"] .say{transition:none}
  .reveal .say{--form:118%}
}
</style>
</head>
<body>

<div class="wrap">
  <h1 class="head" id="heading"></h1>

  <div class="stage" id="stage">
    <div class="state" id="live-state" data-on="1">
      <p class="ask" id="ask"></p>
      <div class="hand" id="hand"></div>
    </div>
    <div class="state" id="reveal" data-on="0">
      <div class="reveal">
        <div class="lashy" id="lashy"></div>
        <div class="say" id="say"></div>
      </div>
    </div>
  </div>

  <p class="sr-only" role="status" aria-live="polite" id="live"></p>
</div>

<script>
/* The content, stamped in at build time — one question, its answers and the box
   underneath them. Same token convention as the lesson's roster: the unbuilt
   template is not runnable JS, by design. */
var KC = /*__KC__*/;
/* Unused here — this staging has no card back to put artwork on — but every
   page the maker can export carries the token, because that is what makes it a
   page the maker recognises. The artwork is never redrawn. See CLAUDE.md. */
var LOGO = /*__LOGO__*/;

var $=function(s){return document.querySelector(s)};

/* ============================================================
   The character — the same geometry and the same expression
   library as the lesson and the card check, so this is
   recognisably her and not a third drawing that drifts.
   ============================================================ */
var LASH={
  open:'<g class="m-lash"><path d="M30.5 34.5 l-3 -2.5"/><path d="M34.5 33.2 l-1 -3"/><path d="M38.5 34 l1.5 -2.8"/>'+
       '<path d="M48.5 34 l-1.5 -2.8"/><path d="M52.5 33.2 l1 -3"/><path d="M56.5 34.5 l3 -2.5"/></g>',
  high:'<g class="m-lash"><path d="M30 33.5 l-3.4 -3"/><path d="M34.3 32 l-1.2 -3.4"/><path d="M38.4 32.8 l1.7 -3.2"/>'+
       '<path d="M48.6 32.8 l-1.7 -3.2"/><path d="M52.7 32 l1.2 -3.4"/><path d="M57 33.5 l3.4 -3"/></g>',
  low: '<g class="m-lash"><path d="M30.8 38 l-3 -1"/><path d="M34.9 36.8 l-.7 -2.2"/><path d="M38.9 37.6 l1.4 -1.9"/>'+
       '<path d="M49.1 37.6 l-1.4 -1.9"/><path d="M53.1 36.8 l.7 -2.2"/><path d="M57.2 38 l3 -1"/></g>'
};
function spark(cx,cy){
  return '<path class="m-spark" d="M'+cx+' '+(cy-4.6)+' q1 3.4 4.6 4.6 q-3.6 1.2 -4.6 4.6 '+
         'q-1 -3.4 -4.6 -4.6 q3.6 -1.2 4.6 -4.6 z"/>';
}
var EYES={
  open:   {e:'<circle class="m-eye" cx="35" cy="39" r="4"/><circle class="m-eye" cx="53" cy="39" r="4"/>', l:"open"},
  sparkle:{e:spark(35,39)+spark(53,39), l:"high"},
  wide:   {e:'<circle class="m-eye" cx="35" cy="39" r="5.2"/><circle class="m-eye" cx="53" cy="39" r="5.2"/>', l:"high"},
  arcs:   {e:'<path class="m-arc" d="M30.5 41 q4.5 -6 9 0"/><path class="m-arc" d="M48.5 41 q4.5 -6 9 0"/>', l:"open"}
};
var MOUTH={tip:"M36 51 q8 7 16 0", plain:"M37 51 q7 4.5 14 0", cheer:"M33 49 q11 10 22 0"};
function svg(eyes,mouth){
  var ex=EYES[eyes]||EYES.open, m=MOUTH[mouth]||MOUTH.tip;
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
    '<g class="m-body">'+
      '<circle class="m-rim" cx="44" cy="42" r="30"/>'+
      '<circle class="m-glass" cx="44" cy="42" r="25"/>'+
      '<g class="m-face"><g class="m-eyes">'+ex.e+'</g>'+LASH[ex.l]+
        '<path class="m-mouth" d="'+m+'"/></g>'+
      '<path class="m-shine" d="M27 30 q7-9 17-10"/>'+
    '</g></svg>';
}

/* ============================================================
   EMBED — the only things this page ever says are that it is
   ready and that it is finished. No score: there is none in
   these simulations, and Rise has no scripting to receive one.
   ============================================================ */
var EMBED=(function(){
  var framed=false, sent=false;
  try{ framed=(window.parent && window.parent!==window); }catch(e){ framed=true; }
  function send(type,data){
    if(!framed) return;
    var msg={source:"hmis-sim",lesson:"hmis-bnts-search",section:"kc",type:type};
    for(var k in data) if(Object.prototype.hasOwnProperty.call(data,k)) msg[k]=data[k];
    try{ window.parent.postMessage(msg,"*"); }catch(e){}
  }
  return {
    framed:function(){ return framed; },
    ready:function(n){ send("ready",{answers:n}); },
    complete:function(){ if(sent) return; sent=true; send("complete",{}); },
    sent:function(){ return sent; }
  };
})();

/* ============================================================
   State — one question, and how many of its answers are left
   ============================================================ */
var Q=(KC.questions||[])[0]||{q:"",a:[],fb:""};
var ANSWERS=(Q.a||[]).map(function(a){ return typeof a==="string" ? a : (a.t||""); })
                     .filter(function(t){ return t!==""; });
var left=ANSWERS.length;
var reduced=!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches);
/* Long enough that a mouse crossing the row does not take everything on its way
   past. It is not a wait — the card is coming apart for all of it. */
var DWELL=420;
var GONE=560;                                /* the commit, matching `.slot.gone` */

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* The writing is authored as plain text in the maker; blank lines are paragraphs. */
function paras(s){
  return String(s||"").split(/\n{2,}/).map(function(p){
    return "<p>"+esc(p.trim()).replace(/\n/g,"<br>")+"</p>";
  }).join("");
}

function deal(){
  if(KC.title) document.title=KC.title;
  /* The heading and the title are NOT the same thing. The title names the tab;
     the heading is an h1 above the question, which a box sitting under a Rise
     slide does not want because the slide is already titled. Falling back to the
     title put the name back on the page that had deliberately not asked for it. */
  var head=KC.heading||"";
  $("#heading").textContent=head;
  /* An empty h1 still takes its margin, which puts a band of nothing above the
     question. */
  $("#heading").hidden=!head;
  $("#ask").textContent=Q.q||"";
  $("#hand").innerHTML=ANSWERS.map(function(t,i){
    return '<div class="slot" id="slot'+i+'">'+
           '<button class="card" data-i="'+i+'">'+esc(t)+'</button></div>';
  }).join("");
  ANSWERS.forEach(function(t,i){ arm(i); });
  /* Written NOW, while it is still hidden, and not when the last answer goes.
     Both states share one grid cell and the cell is as tall as the taller of
     them — but only if the taller one has its content in it. Written at the end
     instead, the block was 269px with the answers on the table and 309px once
     the box arrived, which in Rise shunts the whole slide below it.
     `visibility:hidden` keeps the box and keeps it out of the accessibility
     tree, so filling it early does not make it readable early. */
  $("#say").innerHTML=paras(Q.fb);
  EMBED.ready(ANSWERS.length);
}

/* Resting on a card takes it. A click or the keyboard takes it outright — see
   the note beside `.slot.dwell`: hover is the interaction, those are the floor.

   Coming apart starts on the FIRST frame the pointer is over it: the mask begins
   to fray and motes trickle off the leading edge straight away, and staying is
   what finishes it. Leaving stops the trickle and lets the mask knit back. */
function arm(i){
  var slot=$("#slot"+i), btn=slot.querySelector(".card"), timer=null, trickle=null;
  function stop(){
    slot.classList.remove("dwell");
    clearTimeout(timer); timer=null;
    clearInterval(trickle); trickle=null;
  }
  btn.addEventListener("pointerenter",function(){
    if(slot.classList.contains("gone")) return;
    slot.classList.add("dwell");
    if(!reduced){
      /* A few at a time along the fraying edge. Not the whole burst: that is what
         the card has left to spend when it actually goes. */
      spawn(slot,btn,5,0,0.26,0.12);
      trickle=setInterval(function(){ spawn(slot,btn,4,0,0.3,0.12); },110);
    }
    timer=setTimeout(function(){ stop(); take(i); }, DWELL);
  });
  btn.addEventListener("pointerleave",stop);
  /* A button fires this for Enter and Space too, so the keyboard is covered. */
  btn.addEventListener("click",function(){ stop(); take(i); });
}

/* Motes off the card's own box, carried off the way the sweep runs. `xLo`–`xHi`
   is the band of the card they come from and `spread` is how far their starts are
   scattered in time — the trickle takes a narrow band at the fraying edge and a
   short spread, the burst takes the whole card and spreads across the sweep so
   the leading corner goes first and the far edge last. Released all at once the
   burst reads as a cloud let go from behind the card rather than as the card
   coming apart.

   Each mote removes itself when it has finished, so hovering on and off a card
   repeatedly does not leave a drift of dead spans in the slot. */
function spawn(slot,btn,n,xLo,xHi,spread,inward){
  var r=btn.getBoundingClientRect();
  if(!r.width) return;
  var frag=document.createDocumentFragment();
  for(var k=0;k<n;k++){
    var x=xLo+Math.random()*(xHi-xLo), y=Math.random();
    var d=document.createElement("span");
    /* `inward` runs the same mote backwards: it arrives from where a leaving one
       would have gone, and settles. */
    d.className=inward ? "mote in" : "mote";
    /* Fine and many rather than few and blobby — at three or four pixels they
       read as specks thrown off something, not as dust. */
    var sz=1.2+Math.random()*2.4;
    d.style.left=(x*r.width)+"px";
    d.style.top=(y*r.height)+"px";
    d.style.width=sz+"px"; d.style.height=sz+"px";
    /* The sweep is a 100deg edge, so how far along it a mote sits is mostly its
       x with a little of its y — the same mix the mask uses. */
    var along=x*0.86 + (1-y)*0.14;
    d.style.setProperty("--delay",(along*spread+Math.random()*0.09).toFixed(3)+"s");
    d.style.setProperty("--dur",(0.62+Math.random()*0.5).toFixed(3)+"s");
    /* Kept low: carried far enough to be blown away, not so far that the dust
       from one answer drifts up over the question and reads as litter. */
    d.style.setProperty("--dx",(14+Math.random()*38).toFixed(1)+"px");
    d.style.setProperty("--dy",(-16-Math.random()*40).toFixed(1)+"px");
    d.style.setProperty("--peak",(0.3+Math.random()*0.45).toFixed(2));
    d.addEventListener("animationend",function(){ this.remove(); });
    frag.appendChild(d);
  }
  slot.appendChild(frag);
}

/* She answers a hover: a look up and a nod, and her face changes while the
   pointer is on her. Only her drawing changes — `.mface` is replaced rather than
   the whole of `#lashy`, so the puff and her classes survive it. */
function setFace(el,eyes,mouth){
  var f=el.querySelector(".mface");
  if(f) f.innerHTML=svg(eyes,mouth);
}
function armLashes(){
  var el=$("#lashy"), over=false;
  el.addEventListener("pointerenter",function(){
    /* Guarded as well as made un-hit-testable: one reaction per arrival, so a
       stray second enter cannot restart her mid-nod. */
    if(over) return;
    over=true;
    setFace(el,"arcs","cheer");
    if(reduced) return;
    el.classList.remove("react");
    void el.offsetWidth;                 /* restart it rather than queue it */
    el.classList.add("react");
  });
  el.addEventListener("pointerleave",function(){
    over=false;
    setFace(el,"sparkle","cheer");
    el.classList.remove("react");
  });
}

function take(i){
  var slot=$("#slot"+i);
  if(!slot || slot.classList.contains("gone")) return;
  var btn=slot.querySelector(".card");
  if(!reduced) spawn(slot,btn,Math.min(170,Math.round(
    btn.getBoundingClientRect().width*btn.getBoundingClientRect().height/130)),0,1,0.42);
  slot.classList.add("gone");
  /* Out of the tab order the moment it is taken, so a keyboard learner cannot
     land on a card that is no longer on the table. The slot keeps its box. */
  btn.disabled=true;
  btn.setAttribute("aria-hidden","true");
  left--;
  $("#live").textContent = left ? (left+" left") : "";
  /* Hold the vanished card's space but stop it being read: the sweep ends with
     the card empty, and after it we take it out of the tree as well. */
  setTimeout(function(){ btn.style.visibility="hidden"; }, reduced?0:GONE);
  if(!left) setTimeout(finish, reduced?0:GONE+260);
}

function finish(){
  $("#live-state").dataset.on="0";
  $("#reveal").dataset.on="1";          /* already written — see `deal` */
  /* The writing comes together out of dust, on the same sweep the cards came
     apart on — the mask does the text and these are the motes settling onto it.
     Spread across the sweep so a mote lands about when the sweep reaches it. */
  if(!reduced) spawn($("#say"),$("#say"),150,0,1,0.78,true);
  var el=$("#lashy");
  el.innerHTML='<span class="puff"></span><span class="mface">'+svg("sparkle","cheer")+'</span>';
  if(!reduced){
    void el.offsetWidth; el.classList.add("in");
    /* Taken off once her entrance has played, so the hover reaction is the only
       animation left on her — otherwise the two sit at equal specificity and
       unhovering re-runs the entrance. */
    setTimeout(function(){ el.classList.remove("in"); }, 520);
  }
  armLashes();
  $("#live").textContent=$("#say").textContent;
  EMBED.complete();
}

deal();
</script>
</body>
</html>
